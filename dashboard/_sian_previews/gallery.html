  <div class="stage"><iframe class="frame" data-i="0" title="살아있는 파이프라인" srcdoc="<!doctype html>
<html lang=&quot;ko&quot;>
<head>
<meta charset=&quot;utf-8&quot;>
<meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1&quot;>
<title>CoP Physical AI — 살아있는 파이프라인</title>
<style>
  :root{
    --bg:#eef2f6; --surface:#ffffff; --surface-2:#f1f5f9;
    --border:#e2e8f0; --border-2:#dde5ee;
    --ink:#0f172a; --ink-2:#475569; --muted:#8a99ad;
    --green:#16a34a; --green-bright:#22c55e; --green-soft:#dcfce7;
    --amber:#f59e0b; --amber-soft:#fef3c7;
    --red:#ef4444;
    --track:#c4d0de;
    --shadow:0 1px 2px rgba(15,23,42,.04), 0 12px 30px -12px rgba(15,23,42,.16);
    --shadow-sm:0 1px 2px rgba(15,23,42,.05), 0 6px 16px -10px rgba(15,23,42,.14);
    --radius:18px;
    --glow: rgba(34,197,94,.16);
    --font:-apple-system,BlinkMacSystemFont,&quot;Apple SD Gothic Neo&quot;,&quot;Pretendard&quot;,&quot;Malgun Gothic&quot;,&quot;Segoe UI&quot;,Roboto,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0a0f1a; --surface:#111a2b; --surface-2:#0f1727;
      --border:#1e2b41; --border-2:#22314a;
      --ink:#eaf1fb; --ink-2:#aebccf; --muted:#6b7c94;
      --green:#22c55e; --green-bright:#34d399; --green-soft:rgba(34,197,94,.14);
      --amber:#fbbf24; --amber-soft:rgba(251,191,36,.14);
      --track:#2c3d57;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 18px 40px -18px rgba(0,0,0,.7);
      --shadow-sm:0 1px 2px rgba(0,0,0,.4), 0 10px 24px -14px rgba(0,0,0,.6);
      --glow: rgba(34,197,94,.22);
    }
  }

  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:var(--font); line-height:1.6;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    overflow-x:hidden;
  }
  a{color:inherit; text-decoration:none}
  h1,h2,h3{margin:0; line-height:1.15; letter-spacing:-.02em}
  .tnum{font-variant-numeric:tabular-nums}

  /* ============ NAV ============ */
  .nav{
    position:sticky; top:0; z-index:50;
    backdrop-filter:saturate(1.4) blur(12px);
    background:color-mix(in srgb, var(--bg) 78%, transparent);
    border-bottom:1px solid var(--border);
  }
  .nav-in{
    max-width:1200px; margin:0 auto; padding:14px 22px;
    display:flex; align-items:center; gap:20px;
  }
  .brand{display:flex; align-items:center; gap:10px; font-weight:800; letter-spacing:-.02em; white-space:nowrap}
  .brand .chip{
    width:30px; height:30px; border-radius:9px;
    background:linear-gradient(135deg,var(--green-bright),var(--green));
    display:grid; place-items:center; box-shadow:0 6px 14px -6px var(--green);
  }
  .brand .chip svg{width:18px;height:18px}
  .brand small{display:block; font-weight:600; font-size:11px; color:var(--muted); letter-spacing:.02em; margin-top:-2px}
  .menu{
    margin-left:auto; display:flex; gap:4px; align-items:center;
    overflow-x:auto; scrollbar-width:none;
  }
  .menu::-webkit-scrollbar{display:none}
  .menu a{
    padding:7px 12px; border-radius:10px; font-size:13.5px; font-weight:600;
    color:var(--ink-2); white-space:nowrap; transition:background .18s,color .18s;
  }
  .menu a:hover{background:var(--surface-2); color:var(--ink)}
  .menu a.live{color:var(--green)}
  .menu a.live::before{content:&quot;● &quot;; font-size:9px; vertical-align:2px}

  /* ============ LAYOUT ============ */
  .wrap{max-width:1200px; margin:0 auto; padding:0 22px}
  section{position:relative}
  .eyebrow{
    display:inline-flex; align-items:center; gap:8px;
    font-size:13px; font-weight:700; color:var(--green);
    background:var(--green-soft); border:1px solid color-mix(in srgb,var(--green) 22%, transparent);
    padding:6px 13px; border-radius:999px;
  }
  .eyebrow .dot{width:8px;height:8px;border-radius:50%;background:var(--green-bright);
    box-shadow:0 0 0 0 var(--green-bright); animation:ping 2.2s ease-out infinite}
  @keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--green-bright) 60%,transparent)}
    70%{box-shadow:0 0 0 9px transparent}100%{box-shadow:0 0 0 0 transparent}}

  .sec-head{max-width:640px; margin-bottom:34px}
  .sec-kicker{font-size:13px; font-weight:800; color:var(--green); letter-spacing:.06em; text-transform:uppercase}
  .sec-head h2{font-size:clamp(26px,4.4vw,40px); margin:12px 0 12px; font-weight:800}
  .sec-head p{margin:0; color:var(--ink-2); font-size:16.5px}

  /* ============ HERO ============ */
  .hero{padding:52px 0 30px; position:relative; overflow:hidden}
  #cursorGlow{
    position:absolute; width:520px; height:520px; left:0; top:0;
    border-radius:50%; pointer-events:none; z-index:0;
    background:radial-gradient(circle, var(--glow), transparent 66%);
    transform:translate(-50%,-50%); opacity:0; transition:opacity .5s;
    will-change:transform;
  }
  .hero-grid{position:relative; z-index:1; display:grid; grid-template-columns:1fr; gap:30px}
  .hero-copy{max-width:760px}
  .hero h1{
    font-size:clamp(32px,6vw,58px); font-weight:850; margin:20px 0 18px;
    letter-spacing:-.03em;
  }
  .hero h1 .accent{
    background:linear-gradient(120deg,var(--green),var(--green-bright));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .hero-sub{font-size:clamp(15.5px,2.2vw,18.5px); color:var(--ink-2); max-width:620px; margin:0 0 24px}
  .chips{display:flex; flex-wrap:wrap; gap:10px}
  .stat-chip{
    display:flex; align-items:center; gap:10px; padding:10px 15px;
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    box-shadow:var(--shadow-sm); font-size:13.5px; font-weight:600; color:var(--ink-2);
  }
  .stat-chip b{font-size:19px; font-weight:800; color:var(--ink)}
  .stat-chip .led-mini{width:9px;height:9px;border-radius:50%;flex:none}
  .stat-chip.ok .led-mini{background:var(--green-bright); box-shadow:0 0 8px var(--green-bright)}
  .stat-chip.run .led-mini{background:var(--green-bright); animation:blink 1.5s infinite}
  .stat-chip.wait .led-mini{background:var(--amber)}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.28}}

  /* ---- pipeline stage (hero visual) ---- */
  .stage{
    margin-top:8px; background:var(--surface); border:1px solid var(--border);
    border-radius:24px; box-shadow:var(--shadow); padding:20px 18px 14px; position:relative;
    overflow:hidden;
  }
  .stage::before{ /* soft top sheen */
    content:&quot;&quot;; position:absolute; inset:0 0 auto 0; height:120px;
    background:linear-gradient(180deg, color-mix(in srgb,var(--green) 5%,transparent), transparent);
    pointer-events:none;
  }
  .stage-head{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin:2px 4px 6px; position:relative}
  .stage-head .t{font-weight:800; font-size:14.5px}
  .stage-head .flowlabel{font-size:13px; color:var(--muted); font-weight:600}
  .legend{margin-left:auto; display:flex; gap:14px; font-size:12px; color:var(--ink-2); font-weight:600}
  .legend span{display:inline-flex; align-items:center; gap:6px}
  .legend i{width:9px;height:9px;border-radius:50%; display:inline-block}
  .legend .g{background:var(--green-bright)} .legend .a{background:var(--amber)} .legend .r{background:var(--red)}

  .svg-scroll{overflow-x:auto; overflow-y:hidden; scrollbar-width:none; -webkit-overflow-scrolling:touch}
  .svg-scroll::-webkit-scrollbar{display:none}
  .pipe-svg{display:block; width:100%; min-width:680px; height:auto}
  .scroll-hint{display:none; text-align:center; font-size:11.5px; color:var(--muted); padding:2px 0 4px}

  /* svg element styles */
  .node-box{fill:var(--surface); stroke:var(--border-2); stroke-width:1.5; transition:filter .3s, stroke .3s}
  .node .node-box{filter:drop-shadow(0 6px 14px rgba(15,23,42,.06))}
  .node-title{fill:var(--ink); font-weight:800; font-size:19px; font-family:var(--font)}
  .node-sub{fill:var(--muted); font-weight:600; font-size:12.5px; font-family:var(--font)}
  .node-ico{stroke:var(--green); stroke-width:2; fill:none; stroke-linecap:round; stroke-linejoin:round}
  .node{cursor:pointer}
  .node:hover .node-box, .node.hot .node-box{stroke:var(--green); filter:drop-shadow(0 8px 20px var(--glow))}
  .node .halo{fill:var(--green); opacity:0; transition:opacity .3s}
  .node.hot .halo, .node:hover .halo{opacity:.10}
  .node-badge{fill:var(--green-soft); stroke:none}
  .node-badge-t{fill:var(--green); font-weight:800; font-size:11px; font-family:var(--font)}
  .node.wait .node-ico{stroke:var(--amber)}
  .node.wait .node-badge{fill:var(--amber-soft)} .node.wait .node-badge-t{fill:var(--amber)}

  .spine-base{fill:none; stroke:var(--track); stroke-width:3; stroke-linecap:round}
  .spine-flow{fill:none; stroke:var(--green-bright); stroke-width:3; stroke-linecap:round;
    stroke-dasharray:2 12; opacity:.7; animation:dashflow 1.1s linear infinite}
  .spine-loop{fill:none; stroke:var(--track); stroke-width:2.5; stroke-dasharray:6 8; opacity:.75}
  @keyframes dashflow{to{stroke-dashoffset:-14}}
  .loop-label{fill:var(--muted); font-weight:700; font-size:13px; font-family:var(--font); text-anchor:middle}
  .loop-arrow{fill:var(--track)}

  .packet{fill:var(--green-bright); filter:drop-shadow(0 0 5px var(--green-bright))}
  .packet.loopp{fill:var(--amber); filter:drop-shadow(0 0 4px var(--amber))}

  /* robot + pcb */
  .pcb{fill:#0f5132; stroke:#0a3d26; stroke-width:1.5}
  @media (prefers-color-scheme: dark){ .pcb{fill:#0d3d28; stroke:#093020} }
  .pcb-trace{stroke:#2f8f5f; stroke-width:1.4; fill:none; opacity:.7}
  .pcb-pad{fill:#d9b45b}
  .pcb-label{fill:#bfe8cf; font-size:11px; font-weight:700; font-family:var(--font); text-anchor:middle}
  .arm-seg{stroke:#3a4658; stroke-linecap:round; fill:none}
  .arm-seg2{stroke:#4b5a70; stroke-linecap:round; fill:none}
  .arm-joint{fill:#64748b; stroke:#1e293b; stroke-width:1}
  .arm-joint.acc{fill:var(--green)}
  .arm-tool{fill:#94a3b8; stroke:#475569; stroke-width:1}
  .arm-mount{fill:#334155}
  #armGroup{transform-box:fill-box; transform-origin:center bottom; transition:transform .2s cubic-bezier(.34,1.4,.5,1)}
  #robot.active #armGroup{transform:translateY(8px)}
  .btn-base{fill:#7f1d1d}
  .btn-cap{fill:#ef4444; transform-box:fill-box; transform-origin:center; transition:transform .2s}
  #robot.active .btn-cap{transform:translateY(3px) scaleY(.8); fill:#dc2626}
  .btn-hi{fill:#fca5a5; opacity:.8}
  #led{fill:#153a26; transition:fill .25s}
  #ledGlow{fill:var(--green-bright); opacity:0; transition:opacity .3s}
  #ledCheck{stroke:#052e16; stroke-width:2.4; fill:none; stroke-linecap:round; stroke-linejoin:round; opacity:0; transition:opacity .2s}
  #robot.active #led{fill:#34d399}
  #robot.active #ledGlow{opacity:.55}
  #robot.active #ledCheck{opacity:1}
  .result-cap{fill:var(--ink-2); font-size:12.5px; font-weight:700; font-family:var(--font); text-anchor:middle}

  /* ============ JOURNEY ============ */
  .journey{padding:56px 0 20px}
  .cards{display:grid; grid-template-columns:repeat(3,1fr); gap:18px}
  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:22px; box-shadow:var(--shadow-sm); position:relative; overflow:hidden;
    transition:transform .28s cubic-bezier(.34,1.2,.5,1), box-shadow .28s, border-color .28s;
  }
  .card:hover{transform:translateY(-5px); box-shadow:var(--shadow); border-color:color-mix(in srgb,var(--green) 30%,var(--border))}
  .card .step-no{
    font-size:12px; font-weight:800; letter-spacing:.08em; color:var(--muted);
    display:flex; align-items:center; gap:8px;
  }
  .card .status{
    margin-left:auto; font-size:11.5px; font-weight:800; padding:4px 9px; border-radius:999px;
  }
  .st-done{background:var(--green-soft); color:var(--green)}
  .st-run{background:var(--green-soft); color:var(--green)}
  .st-wait{background:var(--amber-soft); color:var(--amber)}
  .card h3{font-size:20px; margin:14px 0 6px; font-weight:800}
  .card .desc{font-size:14px; color:var(--ink-2); margin:0 0 18px; min-height:44px}
  .prog{height:9px; border-radius:99px; background:var(--surface-2); overflow:hidden; position:relative}
  .prog-fill{height:100%; width:0; border-radius:99px;
    background:linear-gradient(90deg,var(--green),var(--green-bright));
    transition:width 1.3s cubic-bezier(.4,0,.15,1)}
  .prog-fill.wait{background:repeating-linear-gradient(45deg,var(--amber),var(--amber) 6px,transparent 6px,transparent 12px); opacity:.8}
  .prog-row{display:flex; justify-content:space-between; align-items:baseline; margin-top:10px}
  .prog-row .pv{font-size:24px; font-weight:850; letter-spacing:-.02em}
  .prog-row .pl{font-size:12.5px; color:var(--muted); font-weight:600}
  .card .glow-line{position:absolute; left:0; top:0; height:3px; width:100%;
    background:linear-gradient(90deg,transparent,var(--green-bright),transparent);
    transform:translateX(-100%); }
  .card:hover .glow-line{animation:sweep 1.1s ease}
  @keyframes sweep{to{transform:translateX(100%)}}

  /* ============ METRICS ============ */
  .metrics{padding:56px 0 20px}
  .tiles{display:grid; grid-template-columns:repeat(4,1fr); gap:16px}
  .tile{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:22px 20px; box-shadow:var(--shadow-sm); position:relative; overflow:hidden;
    transition:transform .25s, box-shadow .25s;
  }
  .tile:hover{transform:translateY(-4px); box-shadow:var(--shadow)}
  .tile .big{font-size:clamp(34px,5vw,46px); font-weight:850; letter-spacing:-.03em; line-height:1}
  .tile .lab{font-size:13.5px; color:var(--ink-2); font-weight:700; margin-top:10px}
  .tile .sub{font-size:12px; color:var(--muted); margin-top:3px}
  .tile .spark{position:absolute; right:14px; top:14px; opacity:.9}
  .ring-wrap{display:flex; align-items:center; gap:16px}
  .ring{--p:63; width:78px; height:78px; flex:none}
  .ring .bg{fill:none; stroke:var(--surface-2); stroke-width:9}
  .ring .fg{fill:none; stroke:var(--green-bright); stroke-width:9; stroke-linecap:round;
    stroke-dasharray:220; stroke-dashoffset:220; transition:stroke-dashoffset 1.4s cubic-bezier(.4,0,.15,1);
    transform:rotate(-90deg); transform-origin:center}

  /* ============ FLOW EXPLAIN ============ */
  .flowx{padding:56px 0 20px}
  .steps{display:grid; grid-template-columns:repeat(4,1fr); gap:16px; counter-reset:s}
  .fstep{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:22px 20px 20px; box-shadow:var(--shadow-sm); position:relative;
    transition:transform .25s, box-shadow .25s;
  }
  .fstep:hover{transform:translateY(-4px); box-shadow:var(--shadow)}
  .fstep .num{
    width:38px; height:38px; border-radius:11px; display:grid; place-items:center;
    background:var(--green-soft); color:var(--green); font-weight:850; font-size:16px;
    counter-increment:s;
  }
  .fstep .num::before{content:counter(s)}
  .fstep h3{font-size:17px; margin:14px 0 6px; font-weight:800}
  .fstep p{margin:0; font-size:13.5px; color:var(--ink-2)}
  .fstep .arrow{position:absolute; right:-13px; top:38px; color:var(--track); z-index:2}
  .steps .fstep:last-child .arrow{display:none}
  .flow-note{
    margin-top:22px; text-align:center; font-size:15px; font-weight:700; color:var(--ink-2);
  }
  .flow-note b{color:var(--green)}

  /* ============ FOOTER ============ */
  footer{margin-top:60px; border-top:1px solid var(--border); background:var(--surface)}
  .foot-in{max-width:1200px; margin:0 auto; padding:34px 22px; display:flex; flex-wrap:wrap; gap:20px; align-items:center}
  .foot-in .menu{margin-left:0}
  .foot-meta{margin-left:auto; text-align:right; font-size:12.5px; color:var(--muted)}
  .foot-meta b{color:var(--ink-2)}

  /* ============ REVEAL ============ */
  .reveal{opacity:0; transform:translateY(26px); transition:opacity .7s cubic-bezier(.2,.6,.2,1), transform .7s cubic-bezier(.2,.6,.2,1)}
  .reveal.in{opacity:1; transform:none}

  /* intro */
  .hero-copy > *{opacity:0; transform:translateY(18px); animation:rise .8s cubic-bezier(.2,.7,.2,1) forwards}
  .hero-copy > *:nth-child(1){animation-delay:.05s}
  .hero-copy > *:nth-child(2){animation-delay:.14s}
  .hero-copy > *:nth-child(3){animation-delay:.23s}
  .hero-copy > *:nth-child(4){animation-delay:.32s}
  .stage{opacity:0; transform:translateY(24px) scale(.99); animation:rise .9s .4s cubic-bezier(.2,.7,.2,1) forwards}
  @keyframes rise{to{opacity:1; transform:none}}
  .node{opacity:0; transform:scale(.6); transform-box:fill-box; transform-origin:center;
    animation:pop .6s cubic-bezier(.34,1.5,.5,1) forwards}
  #nCollect{animation-delay:.65s} #nTrain{animation-delay:.8s} #nMeasure{animation-delay:.95s}
  #robot{opacity:0; animation:fade .8s 1.05s ease forwards}
  @keyframes pop{to{opacity:1; transform:scale(1)}}

<script>
(function(){
  &quot;use strict&quot;;
  var reduce = window.matchMedia &amp;&amp; window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- cursor glow (interaction 1) ---------- */
  var hero = document.querySelector('.hero');
  var glow = document.getElementById('cursorGlow');
  if(hero &amp;&amp; glow &amp;&amp; !reduce){
    hero.addEventListener('pointermove', function(e){
      var r = hero.getBoundingClientRect();
      glow.style.opacity = 1;
      glow.style.transform = 'translate('+(e.clientX-r.left)+'px,'+(e.clientY-r.top)+'px) translate(-50%,-50%)';
    });
    hero.addEventListener('pointerleave', function(){ glow.style.opacity = 0; });
  }

  /* ---------- pipeline packets + robot press (interaction: living flow) ---------- */
  var svg = document.getElementById('pipeSvg');
  var flow = document.getElementById('flowPath');
  var loop = document.getElementById('loopPath');
  var layer = document.getElementById('packetLayer');
  var robot = document.getElementById('robot');
  var nodes = [
    {el:document.getElementById('nCollect'), cx:130},
    {el:document.getElementById('nTrain'),   cx:375},
    {el:document.getElementById('nMeasure'), cx:620}
  ];
  var pressCooldown = false;
  function pressButton(){
    if(pressCooldown || !robot) return;
    pressCooldown = true;
    robot.classList.add('active');
    setTimeout(function(){ robot.classList.remove('active'); }, 620);
    setTimeout(function(){ pressCooldown = false; }, 900);
  }

  if(svg &amp;&amp; flow &amp;&amp; loop &amp;&amp; layer &amp;&amp; !reduce){
    var flowLen = flow.getTotalLength();
    var loopLen = loop.getTotalLength();
    var SVGNS = &quot;http://www.w3.org/2000/svg&quot;;
    var packets = [];
    function addPacket(path, len, speed, offset, cls){
      var c = document.createElementNS(SVGNS,'circle');
      c.setAttribute('r','5');
      c.setAttribute('class','packet'+(cls?' '+cls:''));
      layer.appendChild(c);
      packets.push({el:c, path:path, len:len, speed:speed, d:offset*len, isFlow:cls!=='loopp'});
    }
    addPacket(flow, flowLen, 165, 0.00);
    addPacket(flow, flowLen, 165, 0.34);
    addPacket(flow, flowLen, 165, 0.67);
    addPacket(loop, loopLen, 140, 0.15, 'loopp');
    addPacket(loop, loopLen, 140, 0.62, 'loopp');

    var last = 0, started = false;
    function tick(ts){
      if(!last) last = ts;
      var dt = Math.min((ts-last)/1000, 0.05); last = ts;
      for(var i=0;i<packets.length;i++){
        var p = packets[i];
        p.d += p.speed*dt;
        if(p.d >= p.len){
          p.d -= p.len;
          if(p.isFlow) pressButton();   // packet reached the button
        }
        var pt = p.path.getPointAtLength(p.d);
        p.el.setAttribute('cx', pt.x);
        p.el.setAttribute('cy', pt.y);
      }
      // node heat when a flow packet is near
      for(var n=0;n<nodes.length;n++){
        var hot=false;
        for(var j=0;j<packets.length;j++){
          if(!packets[j].isFlow) continue;
          var q = packets[j].path.getPointAtLength(packets[j].d);
          if(Math.abs(q.x-nodes[n].cx) < 44 &amp;&amp; Math.abs(q.y-151) < 40){ hot=true; break; }
        }
        nodes[n].el.classList.toggle('hot', hot);
      }
      requestAnimationFrame(tick);
    }
    // start after intro draw-in
    setTimeout(function(){ started=true; requestAnimationFrame(tick); }, 1100);
  } else if(robot){
    robot.classList.add('active'); // reduced-motion: show success state statically
  }

  /* mark 3rd node as waiting-ish color? keep green; measure stays green (active) */

  /* ---------- scroll reveal + countup + progress (interaction 2) ---------- */
  function runCount(el){
    var target = parseFloat(el.getAttribute('data-count'));
    var dec = parseInt(el.getAttribute('data-dec')||'0',10);
    var pre = el.getAttribute('data-prefix')||'';
    var suf = el.getAttribute('data-suffix')||'';
    if(reduce){ el.textContent = pre+target.toFixed(dec)+suf; return; }
    var dur = 1200, t0 = null;
    function step(ts){
      if(!t0) t0 = ts;
      var k = Math.min((ts-t0)/dur, 1);
      var e = 1-Math.pow(1-k,3); // easeOutCubic
      el.textContent = pre + (target*e).toFixed(dec) + suf;
      if(k<1) requestAnimationFrame(step); else el.textContent = pre+target.toFixed(dec)+suf;
    }
    requestAnimationFrame(step);
  }

  var seen = new WeakSet();
  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(en){
      if(!en.isIntersecting || seen.has(en.target)) return;
      seen.add(en.target);
      en.target.classList.add('in');
      // countups inside
      en.target.querySelectorAll('[data-count]').forEach(runCount);
      // progress bars inside
      en.target.querySelectorAll('.prog-fill').forEach(function(f){
        var w = f.getAttribute('data-w');
        if(reduce){ f.style.width = w+'%'; }
        else { requestAnimationFrame(function(){ f.style.width = w+'%'; }); }
      });
      // schedule ring
      var ring = en.target.querySelector('#ringFg');
      if(ring){
        var pct = 63, dash = 220, off = dash*(1-pct/100);
        if(reduce){ ring.style.strokeDashoffset = off; }
        else setTimeout(function(){ ring.style.strokeDashoffset = off; }, 120);
      }
    });
  }, {threshold:0.28});

  document.querySelectorAll('.reveal').forEach(function(el,i){
    el.style.transitionDelay = (Math.min(i,4)*70)+'ms';
    io.observe(el);
  });
  // tiles/cards inside reveal grids also observed individually for their counts
  document.querySelectorAll('.tile,.card').forEach(function(el){ io.observe(el); });

  // hero chips counters are static text (already correct) — no action needed.
})();
</script>

<script>
(function(){
  &quot;use strict&quot;;
  var RM = window.matchMedia(&quot;(prefers-reduced-motion: reduce)&quot;).matches;

  /* ---------- 부팅 시퀀스 ---------- */
  var boot=document.getElementById(&quot;boot&quot;), bar=document.getElementById(&quot;bootbar&quot;);
  var blines=document.querySelectorAll(&quot;[data-b]&quot;);
  function finishBoot(){ boot.classList.add(&quot;done&quot;); startAll(); }
  if(RM){ boot.style.transition=&quot;none&quot;; finishBoot(); }
  else{
    blines.forEach(function(l,i){ setTimeout(function(){ l.style.transition=&quot;opacity .3s&quot;; l.style.opacity=&quot;1&quot;; }, 180+i*230); });
    if(bar){ bar.style.transition=&quot;width 1.5s cubic-bezier(.4,0,.2,1)&quot;; requestAnimationFrame(function(){ bar.style.width=&quot;100%&quot;; }); }
    setTimeout(finishBoot, 1750);
  }

  /* ---------- 커서 추적 배경 ---------- */
  var root=document.documentElement;
  if(!RM){
    window.addEventListener(&quot;pointermove&quot;, function(e){
      root.style.setProperty(&quot;--mx&quot;,(e.clientX/window.innerWidth*100)+&quot;%&quot;);
      root.style.setProperty(&quot;--my&quot;,(e.clientY/window.innerHeight*100)+&quot;%&quot;);
    }, {passive:true});
  }

  /* ---------- 시계 ---------- */
  var clk=document.getElementById(&quot;clock&quot;);
  function tick(){ if(!clk)return; var d=new Date();
    clk.textContent=[d.getHours(),d.getMinutes(),d.getSeconds()].map(function(n){return(n<10?&quot;0&quot;:&quot;&quot;)+n}).join(&quot;:&quot;); }
  tick(); setInterval(tick,1000);

  /* ---------- 카운트업 ---------- */
  function countUp(el){
    var target=parseFloat(el.getAttribute(&quot;data-count&quot;));
    var dec=parseInt(el.getAttribute(&quot;data-dec&quot;)||&quot;0&quot;,10);
    if(RM){ el.textContent=target.toFixed(dec); return; }
    var start=performance.now(), dur=1300;
    function step(now){
      var p=Math.min((now-start)/dur,1), e=1-Math.pow(1-p,3);
      el.textContent=(target*e).toFixed(dec);
      if(p<1) requestAnimationFrame(step); else el.textContent=target.toFixed(dec);
    }
    requestAnimationFrame(step);
  }

  /* ---------- 게이지 렌더 ---------- */
  var colMap={grn:&quot;var(--grn)&quot;,amb:&quot;var(--amb)&quot;,cyn:&quot;var(--cyn)&quot;};
  function buildGauge(card){
    var wrap=card.querySelector(&quot;.gwrap&quot;);
    var pct=parseFloat(card.getAttribute(&quot;data-g&quot;));
    var col=colMap[card.getAttribute(&quot;data-col&quot;)]||&quot;var(--grn)&quot;;
    var manual=card.getAttribute(&quot;data-manual&quot;);
    var suffix=card.getAttribute(&quot;data-suffix&quot;);
    var r=54, C=2*Math.PI*r;
    wrap.innerHTML=
      '<svg width=&quot;132&quot; height=&quot;132&quot; viewBox=&quot;0 0 132 132&quot;>'+
      '<circle cx=&quot;66&quot; cy=&quot;66&quot; r=&quot;'+r+'&quot; fill=&quot;none&quot; stroke=&quot;var(--line2)&quot; stroke-width=&quot;9&quot;/>'+
      '<circle class=&quot;arc&quot; cx=&quot;66&quot; cy=&quot;66&quot; r=&quot;'+r+'&quot; fill=&quot;none&quot; stroke=&quot;'+col+'&quot; stroke-width=&quot;9&quot; stroke-linecap=&quot;round&quot; '+
      'stroke-dasharray=&quot;'+C+'&quot; stroke-dashoffset=&quot;'+C+'&quot; style=&quot;filter:drop-shadow(0 0 6px '+col+')&quot;/></svg>'+
      '<div class=&quot;ctr&quot;><div class=&quot;big&quot; style=&quot;color:'+col+'&quot;>'+(manual||&quot;0&quot;)+'</div><div class=&quot;u&quot;>'+(suffix||(manual?&quot;&quot;:&quot;%&quot;))+'</div></div>';
    var arc=wrap.querySelector(&quot;.arc&quot;);
    var big=wrap.querySelector(&quot;.big&quot;);
    var off=C*(1-pct/100);
    if(RM){ arc.style.strokeDashoffset=off; if(!manual) big.textContent=pct%1?pct.toFixed(1):pct.toFixed(0); return; }
    arc.style.transition=&quot;stroke-dashoffset 1.4s cubic-bezier(.2,.7,.2,1)&quot;;
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ arc.style.strokeDashoffset=off; }); });
    if(!manual){
      var s=performance.now();
      (function anim(now){ var p=Math.min((now-s)/1400,1),e=1-Math.pow(1-p,3);
        big.textContent=(pct*e).toFixed(pct%1?1:0);
        if(p<1)requestAnimationFrame(anim); else big.textContent=pct%1?pct.toFixed(1):pct.toFixed(0);
      })(s);
    }
  }

  /* ---------- 스파크라인 그리기 ---------- */
  function drawSpark(pl){
    if(RM)return;
    var len=pl.getTotalLength();
    pl.style.strokeDasharray=len; pl.style.strokeDashoffset=len;
    pl.style.transition=&quot;stroke-dashoffset 1.4s ease .3s&quot;;
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ pl.style.strokeDashoffset=0; }); });
  }

  /* ---------- 로봇팔 커서 추적 ---------- */
  var stage=document.getElementById(&quot;stage&quot;),
      shoulder=document.getElementById(&quot;shoulder&quot;),
      elbow=document.getElementById(&quot;elbow&quot;),
      wrist=document.getElementById(&quot;wrist&quot;);
  var cur={sh:0,el:0,wr:0}, tgt={sh:0,el:0,wr:0}, armRAF=null, pressing=false;
  // 관절 회전 피벗(뷰박스 좌표)
  var P={ sh:{x:118,y:240}, el:{x:0,y:0}, wr:{x:142,y:0} };
  function setArm(){
    shoulder.setAttribute(&quot;transform&quot;,&quot;rotate(&quot;+cur.sh.toFixed(2)+&quot; &quot;+P.sh.x+&quot; &quot;+P.sh.y+&quot;)&quot;);
    elbow.setAttribute(&quot;transform&quot;,&quot;translate(118 128) rotate(&quot;+cur.el.toFixed(2)+&quot; 0 0)&quot;);
    wrist.setAttribute(&quot;transform&quot;,&quot;translate(142 0) rotate(&quot;+cur.wr.toFixed(2)+&quot; 0 0)&quot;);
  }
  function armLoop(){
    cur.sh+=(tgt.sh-cur.sh)*0.08; cur.el+=(tgt.el-cur.el)*0.08; cur.wr+=(tgt.wr-cur.wr)*0.08;
    setArm();
    if(Math.abs(tgt.sh-cur.sh)>0.01||Math.abs(tgt.el-cur.el)>0.01||Math.abs(tgt.wr-cur.wr)>0.01){ armRAF=requestAnimationFrame(armLoop); }
    else armRAF=null;
  }
  function nudge(){ if(!armRAF) armRAF=requestAnimationFrame(armLoop); }
  if(stage &amp;&amp; !RM){
    window.addEventListener(&quot;pointermove&quot;, function(e){
      if(pressing) return;
      var b=stage.getBoundingClientRect();
      var nx=(e.clientX-b.left)/b.width-0.5;   // -0.5..0.5
      var ny=(e.clientY-b.top)/b.height-0.5;
      tgt.sh = nx*6;         // 어깨 좌우
      tgt.el = ny*8 + nx*3;  // 팔꿈치 상하
      tgt.wr = nx*10 - ny*4; // 손목 시선
      nudge();
    }, {passive:true});
  }

  /* ---------- 로그 콘솔 ---------- */
  var logEl=document.getElementById(&quot;log&quot;);
  var seed=[
    ['t','[00:04:12] ','cy','scheduler ','','→ nightly pipeline armed'],
    ['t','[02:31:08] ','','collect ','','episodes captured  n=180'],
    ['t','[03:12:44] ','','train ','cy','ACT policy  epoch 0029'],
    ['t','[04:05:01] ','','rollout ','ok','S1 seed7    9/10  ✓'],
    ['t','[04:05:22] ','','rollout ','ok','S1 seed42   10/10 ✓'],
    ['t','[04:05:48] ','am','rollout ','am','S1 seed123  8/10  ◐'],
    ['t','[04:06:10] ','','rollout ','ok','S1 seed2026 10/10 ✓'],
    ['t','[04:06:30] ','cy','measure ','ok','mean success = 92.5%'],
    ['t','[04:06:31] ','','commit ','','metrics → dashboard/data.json']
  ];
  function addLine(parts){
    var d=document.createElement(&quot;div&quot;);
    for(var i=0;i<parts.length;i+=2){
      var cls=parts[i], txt=parts[i+1];
      if(cls){ var s=document.createElement(&quot;span&quot;); s.className=cls; s.textContent=txt; d.appendChild(s); }
      else d.appendChild(document.createTextNode(txt));
    }
    logEl.appendChild(d);
    while(logEl.children.length>6) logEl.removeChild(logEl.firstChild);
  }
  var li=0;
  function feedLog(){
    addLine(seed[li%seed.length]); li++;
    setTimeout(feedLog, 1400+Math.random()*1200);
  }

  /* ---------- S1 시퀀스 실행(시그니처 인터랙션) ---------- */
  var runbtn=document.getElementById(&quot;runbtn&quot;), runstate=document.getElementById(&quot;runstate&quot;),
      succEl=document.getElementById(&quot;succ&quot;), gripper=document.getElementById(&quot;gripper&quot;),
      ledcore=document.getElementById(&quot;ledcore&quot;), ledring=document.getElementById(&quot;ledring&quot;),
      btncap=document.getElementById(&quot;btncap&quot;), succ=37;
  function runS1(){
    if(runbtn.disabled) return;
    runbtn.disabled=true; runstate.textContent=&quot;실행 중…&quot;; runstate.style.color=&quot;var(--amb)&quot;;
    addLine(['t','[live] ','cy','exec ','','S1 시퀀스 시작 — 리셋 버튼 접근']);
    var wristEl=document.getElementById(&quot;wrist&quot;);
    // 팔을 중립으로 고정한 뒤 그리퍼를 버튼 위로 정렬
    pressing=true; cur.sh=cur.el=cur.wr=tgt.sh=tgt.el=tgt.wr=0; setArm();
    if(!RM){ wristEl.style.transition=&quot;transform .5s cubic-bezier(.3,.7,.2,1)&quot;; wristEl.setAttribute(&quot;transform&quot;,&quot;translate(142 20)&quot;); }
    setTimeout(function(){
      // 버튼 눌림
      if(!RM){ btncap.setAttribute(&quot;r&quot;,&quot;8&quot;); btncap.setAttribute(&quot;cy&quot;,&quot;199&quot;); }
      addLine(['t','[live] ','','press ','','RESET 버튼 접점 ON']);
    },560);
    setTimeout(function(){
      // LED 점등
      ledcore.setAttribute(&quot;fill&quot;,&quot;url(#led)&quot;);
      ledring.setAttribute(&quot;stroke&quot;,&quot;var(--grn)&quot;);
      if(!RM){ ledcore.style.filter=&quot;drop-shadow(0 0 10px var(--grn))&quot;; }
      addLine(['t','[live] ','ok','result ','ok','LED GREEN — 성공 ✓']);
      succ=Math.min(succ+1,40); succEl.textContent=succ;
      runstate.textContent=&quot;성공 ✓&quot;; runstate.style.color=&quot;var(--grn)&quot;;
    },1050);
    setTimeout(function(){
      // 원위치
      if(!RM){ btncap.setAttribute(&quot;r&quot;,&quot;10&quot;); btncap.setAttribute(&quot;cy&quot;,&quot;196&quot;); wristEl.setAttribute(&quot;transform&quot;,&quot;translate(142 0) rotate(0 0 0)&quot;); }
    },1700);
    setTimeout(function(){
      ledcore.setAttribute(&quot;fill&quot;,&quot;#22323f&quot;); ledcore.style.filter=&quot;none&quot;; ledring.setAttribute(&quot;stroke&quot;,&quot;#2a3a4a&quot;);
      runstate.textContent=&quot;대기 중&quot;; runstate.style.color=&quot;&quot;; runbtn.disabled=false;
      pressing=false; cur.sh=cur.el=cur.wr=0; setArm();
    },2700);
  }
  if(runbtn) runbtn.addEventListener(&quot;click&quot;, runS1);

  /* ---------- 스크롤 리빌 + 지연 로드 ---------- */
  var io=new IntersectionObserver(function(ents){
    ents.forEach(function(en){
      if(!en.isIntersecting) return;
      var el=en.target;
      el.classList.add(&quot;in&quot;);
      // 카드 진척 바
      var pi=el.querySelector(&quot;.prog i&quot;);
      if(pi){ setTimeout(function(){ pi.style.width=pi.getAttribute(&quot;data-w&quot;)+&quot;%&quot;; },120); }
      // 게이지
      if(el.classList.contains(&quot;gcard&quot;) &amp;&amp; !el.dataset.built){ el.dataset.built=&quot;1&quot;; buildGauge(el); }
      // 카드 안 카운트업
      el.querySelectorAll(&quot;[data-count]&quot;).forEach(function(c){ if(!c.dataset.done){ c.dataset.done=&quot;1&quot;; countUp(c);} });
      io.unobserve(el);
    });
  },{threshold:0.25});
  document.querySelectorAll(&quot;.reveal&quot;).forEach(function(e){ io.observe(e); });

  /* ---------- 모바일 메뉴 ---------- */
  var mb=document.getElementById(&quot;menubtn&quot;), lk=document.getElementById(&quot;links&quot;);
  if(mb) mb.addEventListener(&quot;click&quot;, function(){ lk.classList.toggle(&quot;open&quot;); });
  lk &amp;&amp; lk.addEventListener(&quot;click&quot;, function(e){ if(e.target.tagName===&quot;A&quot;) lk.classList.remove(&quot;open&quot;); });

  /* ---------- 전체 시작(부팅 후) ---------- */
  function startAll(){
    // 히어로 카운트업 + 스파크라인
    document.querySelectorAll(&quot;.hero [data-count], header [data-count]&quot;).forEach(function(c){ if(!c.dataset.done){ c.dataset.done=&quot;1&quot;; countUp(c);} });
    document.querySelectorAll(&quot;.console .sk&quot;).forEach(drawSpark);
    setArm();
    feedLog();
  }
})();

.scan{position:fixed; top:0; left:0; height:3px; width:100%; z-index:41; transform:scaleX(0); transform-origin:0 50%;

/* ---------- hero ---------- */
.hero{position:relative; min-height:100svh; display:flex; flex-direction:column; justify-content:center;
  padding:120px clamp(16px,6vw,90px) 90px; max-width:1200px; margin:0 auto}

.hero h1{

  font-size:clamp(38px,8.4vw,104px); margin:.28em 0 .12em; max-width:16ch;
}
.hero h1 .accent{color:var(--terra); position:relative; white-space:nowrap}
.hero h1 .accent::after{content:&quot;&quot;; position:absolute; left:0; right:0; bottom:.08em; height:.14em;
  background:color-mix(in srgb,var(--terra) 40%,transparent); border-radius:2px; transform:scaleX(0); transform-origin:0 50%;
  animation:underline 1s cubic-bezier(.2,.7,.2,1) 1.15s both}

.lede{font-size:clamp(16px,2.2vw,22px); color:var(--ink2); max-width:46ch; margin-top:6px}

.herofoot{display:flex; flex-wrap:wrap; align-items:center; gap:14px 26px; margin-top:38px}
.chip{display:inline-flex; align-items:center; gap:9px; padding:9px 15px; border-radius:999px;
  background:var(--paper); border:1px solid var(--line); font-size:14px; box-shadow:var(--shadow)}
.chip .led{width:9px;height:9px;border-radius:50%}
.led.g{background:var(--green);box-shadow:0 0 8px var(--green2)}
.led.a{background:var(--amber);box-shadow:0 0 8px var(--amber)}
.led.r{background:var(--red)}
.scrollcue{display:flex; align-items:center; gap:10px; color:var(--ink2); font-size:13px; font-family:var(--serif); font-style:italic; margin-top:44px}
.mouse{width:22px; height:34px; border:1.6px solid var(--ink2); border-radius:12px; position:relative}
.mouse::after{content:&quot;&quot;; position:absolute; left:50%; top:6px; width:3px; height:6px; border-radius:2px; background:var(--ink2); transform:translateX(-50%); animation:wheel 1.6s ease-in-out infinite}
@keyframes wheel{0%{opacity:0;transform:translate(-50%,0)}30%{opacity:1}60%{opacity:1;transform:translate(-50%,7px)}100%{opacity:0;transform:translate(-50%,10px)}}

/* stagger entrance */
.reveal{opacity:1; transform:none}
@media (prefers-reduced-motion:no-preference){

  html.js.loaded .reveal.d5{transition-delay:.86s} html.js.loaded .reveal.d6{transition-delay:1.02s}

/* ---------- section shell ---------- */
.sec-head{max-width:1200px; margin:0 auto; padding:0 clamp(16px,6vw,90px)}
.eyebrow{display:inline-flex; align-items:center; gap:10px; font-family:var(--serif); font-style:italic; color:var(--terra); font-size:15px; letter-spacing:.04em}
.eyebrow::before{content:&quot;&quot;; width:34px; height:1px; background:var(--terra)}
.sec-title{font-family:var(--myeong); font-weight:800; font-size:clamp(28px,4.4vw,52px); letter-spacing:-.01em; margin:.35em 0 .1em; line-height:1.1}
.sec-sub{color:var(--ink2); max-width:52ch; font-size:clamp(15px,1.8vw,18px)}

/* ---------- scrollytelling ---------- */
.scrolly{position:relative; max-width:1200px; margin:40px auto 0; padding:0 clamp(16px,6vw,90px);
  display:grid; grid-template-columns:1fr 1fr; gap:clamp(24px,5vw,70px)}
.stage-visual{position:sticky; top:0; height:100svh; display:flex; align-items:center; justify-content:center}
.stagewrap{position:relative; width:100%; aspect-ratio:6/7; max-height:82svh}
.robotsvg{width:100%; height:100%; display:block; overflow:visible}
.stage-chip{position:absolute; left:50%; top:6%; transform:translateX(-50%);
  display:flex; align-items:center; gap:9px; padding:8px 15px; border-radius:999px;
  background:var(--paper); border:1px solid var(--line); box-shadow:var(--shadow); font-size:13.5px; font-weight:600;
  transition:opacity .5s}
.stage-chip .tag{font-family:var(--serif); color:var(--terra)}

/* progress rail */
.rail{position:absolute; left:-2px; top:12%; bottom:12%; width:2px; background:var(--line); border-radius:2px}
.rail .fill{position:absolute; left:0; top:0; width:100%; background:linear-gradient(var(--terra),var(--green)); border-radius:2px; height:0; transition:height .5s cubic-bezier(.2,.7,.2,1)}
.rail .node{position:absolute; left:50%; width:14px; height:14px; margin-left:-7px; border-radius:50%;
  background:var(--bg); border:2px solid var(--line); transition:all .4s}
.rail .node.on{border-color:var(--terra); background:var(--terra); box-shadow:0 0 0 6px color-mix(in srgb,var(--terra) 18%,transparent)}
.rail .node.done{border-color:var(--green); background:var(--green)}

.steps{display:flex; flex-direction:column}
.step{min-height:100svh; display:flex; flex-direction:column; justify-content:center; padding:8vh 0}
.step .no{font-family:var(--serif); font-size:clamp(46px,7vw,92px); line-height:.9; color:var(--terra); opacity:.28}

.step h3{font-family:var(--myeong); font-weight:800; font-size:clamp(26px,3.6vw,42px); line-height:1.12; margin:.15em 0 .3em}

  border-radius:0 10px 10px 0; font-size:14.5px; color:var(--ink)}
.step .kids b{color:var(--terra)}
.step .stat{display:flex; align-items:baseline; gap:12px; margin-top:20px}
.step .stat .big{font-family:var(--serif); font-size:clamp(40px,6vw,66px); font-weight:600; line-height:1}
.step .stat .lbl{font-size:13.5px; color:var(--ink2); max-width:16ch}
.b-done{color:var(--green)} .b-live{color:var(--amber)} .b-next{color:var(--ink2)}

/* ---------- metrics band ---------- */
.metrics{max-width:1200px; margin:20px auto 0; padding:70px clamp(16px,6vw,90px)}
.mgrid{display:grid; grid-template-columns:repeat(4,1fr); gap:clamp(14px,2.2vw,26px); margin-top:34px}
.mcard{background:var(--paper); border:1px solid var(--line); border-radius:18px; padding:24px 22px 22px; box-shadow:var(--shadow);

.mcard:hover{transform:translateY(-6px)}

.mcard .val{font-family:var(--serif); font-weight:600; font-size:clamp(42px,6vw,64px); line-height:1; margin:14px 0 2px}
.mcard .unit{font-size:.42em; color:var(--ink2); margin-left:4px; font-weight:500}
.mcard .foot{font-size:13px; color:var(--ink2)}
.mcard .spark{position:absolute; right:-6px; bottom:-6px; width:96px; height:60px; opacity:.5}
.mcard.hl{background:linear-gradient(160deg, color-mix(in srgb,var(--green) 14%,var(--paper)), var(--paper))}
.mcard.hl .val{color:var(--green)}

/* ---------- pipeline ---------- */
.pipeline{max-width:1200px; margin:0 auto; padding:40px clamp(16px,6vw,90px) 90px}
.pipewrap{margin-top:34px; background:var(--paper); border:1px solid var(--line); border-radius:22px; box-shadow:var(--shadow);
  padding:30px clamp(16px,3vw,40px) 22px}
.pipesvg{width:100%; height:auto; display:block}
.pipelegend{display:flex; flex-wrap:wrap; gap:16px 24px; margin-top:14px; font-size:13.5px; color:var(--ink2)}
.pipelegend span{display:inline-flex; align-items:center; gap:8px}

/* ---------- footer / menu ---------- */
.foot{max-width:1200px; margin:0 auto; padding:30px clamp(16px,6vw,90px) 80px}
.menu{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:14px; margin-top:24px}
.mlink{display:flex; flex-direction:column; gap:6px; padding:18px; border-radius:16px; border:1px solid var(--line);
  background:var(--paper); transition:transform .3s, border-color .3s}
.mlink:hover{transform:translateY(-4px); border-color:var(--terra)}
.mlink .t{font-weight:700; display:flex; align-items:center; gap:9px}
.mlink .d{font-size:13px; color:var(--ink2)}
.mlink .arrow{margin-left:auto; color:var(--terra); transition:transform .3s}
.mlink:hover .arrow{transform:translateX(4px)}
.copyright{margin-top:40px; padding-top:22px; border-top:1px solid var(--line); color:var(--ink2); font-size:13px; display:flex; flex-wrap:wrap; gap:8px 18px; justify-content:space-between}
.copyright em{font-family:var(--serif)}

/* count-up entrance for whole blocks */
.up{opacity:0; transform:translateY(22px)}
.up.in{opacity:1; transform:none; transition:opacity .8s ease, transform .8s cubic-bezier(.2,.7,.2,1)}
@media (prefers-reduced-motion:reduce){ .up{opacity:1; transform:none} }

/* responsive */
@media (max-width:820px){
  .scrolly{grid-template-columns:1fr; gap:0}
  .stage-visual{position:sticky; top:56px; height:44svh; z-index:5; background:linear-gradient(var(--bg),color-mix(in srgb,var(--bg) 80%,transparent) 88%, transparent);
    margin:0 calc(-1*clamp(16px,6vw,90px)); padding-top:6px}
  .stagewrap{aspect-ratio:auto; height:100%; max-height:none}
  .rail{display:none}
  .step{min-height:auto; padding:44px 0 40px}
  .steps{margin-top:8px}
  .mgrid{grid-template-columns:repeat(2,1fr)}
  .nav{display:none}
}
@media (max-width:460px){ .mgrid{grid-template-columns:1fr} }

/* robot stage transitions */
.robotsvg [data-joint]{transition:transform 1.1s cubic-bezier(.4,.05,.2,1)}

.scene{opacity:0; transition:opacity .7s ease, transform .7s ease; transform:translateY(6px)}

#successChip{opacity:0; transition:opacity .5s .35s}
.robotsvg text,.pipesvg text{font-family:var(--sans)}

<script>
(function(){
  var root=document.documentElement;
  root.classList.add('js');
  var reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;

  // stagger entrance
  function markLoaded(){ root.classList.add('loaded'); }
  if(document.readyState!=='loading') markLoaded(); else window.addEventListener('DOMContentLoaded',markLoaded);

  // theme toggle
  var tBtn=document.getElementById('themeBtn');
  tBtn.addEventListener('click',function(){
    var cur=root.getAttribute('data-theme');
    var dark=cur? cur==='dark' : matchMedia('(prefers-color-scheme:dark)').matches;
    root.setAttribute('data-theme', dark?'light':'dark');
  });

  // scroll progress bar (rAF throttled)
  var scan=document.querySelector('.scan'), ticking=false;
  function draw(){
    var h=document.documentElement, max=h.scrollHeight-h.clientHeight;
    var p=max>0? h.scrollTop/max : 0;
    scan.style.transform='scaleX('+p+')';
    ticking=false;
  }
  addEventListener('scroll',function(){ if(!ticking){ ticking=true; requestAnimationFrame(draw); } },{passive:true});
  draw();

  // ---- scrollytelling stage control ----
  var robot=document.getElementById('robot'),
      chip=document.getElementById('stageChip'),
      steps=[].slice.call(document.querySelectorAll('.step')),
      nodes=[].slice.call(document.querySelectorAll('.rail .node')),
      fill=document.getElementById('railFill'),
      chipText=['1단계 · 물건 집어 옮기기','2단계 · 리셋 버튼 누르기','3단계 · 케이블 분리'],
      chipTag=['1단계','2단계','3단계'],
      cur=1;
  function setStage(i){
    if(i===cur) return; cur=i;
    robot.setAttribute('class','robotsvg s'+i);
    chip.innerHTML='<span class=&quot;tag&quot;>'+chipTag[i-1]+'</span> '+chipText[i-1].split('· ')[1];
    steps.forEach(function(s){ s.classList.toggle('on', +s.dataset.stage===i); });
    nodes.forEach(function(n){ var k=+n.dataset.node; n.classList.toggle('on',k===i); n.classList.toggle('done',k<i); });
    fill.style.height=((i-1)/2*100)+'%';
  }
  setStage(1);
  var so=new IntersectionObserver(function(es){
    es.forEach(function(e){ if(e.isIntersecting) setStage(+e.target.dataset.stage); });
  },{rootMargin:'-45% 0px -45% 0px', threshold:0});
  steps.forEach(function(s){ so.observe(s); });

  // ---- count-up ----
  function countUp(el){
    var target=parseFloat(el.dataset.count), dec=parseInt(el.dataset.dec||'0',10);
    if(reduce){ el.textContent=target.toFixed(dec); return; }
    var start=performance.now(), dur=1300;
    function step(t){
      var p=Math.min((t-start)/dur,1), e=1-Math.pow(1-p,3);
      el.textContent=(target*e).toFixed(dec);
      if(p<1) requestAnimationFrame(step); else el.textContent=target.toFixed(dec);
    }
    requestAnimationFrame(step);
  }
  var counted=new WeakSet();
  var co=new IntersectionObserver(function(es){
    es.forEach(function(e){ if(e.isIntersecting &amp;&amp; !counted.has(e.target)){ counted.add(e.target); countUp(e.target); } });
  },{threshold:.6});
  document.querySelectorAll('[data-count]').forEach(function(el){ co.observe(el); });

  // ---- generic block reveal (.up) ----
  var uo=new IntersectionObserver(function(es){
    es.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add('in'); uo.unobserve(e.target); } });
  },{threshold:.2, rootMargin:'0px 0px -8% 0px'});
  document.querySelectorAll('.up').forEach(function(el){ uo.observe(el); });

  // ---- cursor parallax (hero halo + arm lean) ----
  if(!reduce){
    var halo=document.getElementById('haloE');
    var raf=false, mx=0, my=0;
    addEventListener('pointermove',function(ev){
      mx=(ev.clientX/innerWidth-.5); my=(ev.clientY/innerHeight-.5);
      if(!raf){ raf=true; requestAnimationFrame(function(){
        if(halo){ halo.setAttribute('cx', 330+mx*70); halo.setAttribute('cy', 300+my*50); }
        raf=false;
      }); }
    },{passive:true});
  }

  // ---- click easter egg: poke the robot -> flash success ----
  robot.addEventListener('click',function(){
    if(cur===2) return;

<script>
(function(){
  &quot;use strict&quot;;
  var reduce = window.matchMedia(&quot;(prefers-reduced-motion: reduce)&quot;).matches;
  var coarse = window.matchMedia(&quot;(pointer: coarse)&quot;).matches;

  /* ---------- 스프링 진입 ---------- */
  requestAnimationFrame(function(){ document.body.classList.add(&quot;go&quot;); });

  /* ---------- 테마 토글 ---------- */
  var root = document.documentElement, tb = document.getElementById(&quot;themeBtn&quot;);
  try{ var saved = localStorage.getItem(&quot;cop-theme&quot;); if(saved) root.setAttribute(&quot;data-theme&quot;, saved); }catch(e){}
  tb.addEventListener(&quot;click&quot;, function(){
    var cur = root.getAttribute(&quot;data-theme&quot;);
    var next = cur === &quot;dark&quot; ? &quot;light&quot; : (cur === &quot;light&quot; ? &quot;dark&quot; :
      (window.matchMedia(&quot;(prefers-color-scheme: dark)&quot;).matches ? &quot;light&quot; : &quot;dark&quot;));
    root.setAttribute(&quot;data-theme&quot;, next);
    try{ localStorage.setItem(&quot;cop-theme&quot;, next); }catch(e){}
  });

  /* ---------- 스크롤 리빌 + 카운트업 + 미터 ---------- */
  function countUp(el){
    var to = parseFloat(el.getAttribute(&quot;data-to&quot;));
    var pre = el.getAttribute(&quot;data-prefix&quot;)||&quot;&quot;, suf = el.getAttribute(&quot;data-suffix&quot;)||&quot;&quot;;
    var dec = (to % 1 !== 0) ? 1 : 0;
    if(reduce){ el.textContent = pre + to.toFixed(dec) + suf; return; }
    var start = performance.now(), dur = 1050;
    function tick(now){
      var p = Math.min(1, (now-start)/dur);
      var e = 1 - Math.pow(1-p, 3);
      el.textContent = pre + (to*e).toFixed(dec) + suf;
      if(p<1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }
  var io = new IntersectionObserver(function(ents){
    ents.forEach(function(en){
      if(!en.isIntersecting) return;
      var el = en.target;
      el.classList.add(&quot;in&quot;);
      if(el.classList.contains(&quot;jcard&quot;)){
        var m = el.querySelector(&quot;.meter b&quot;);
        if(m) m.style.width = el.getAttribute(&quot;data-fill&quot;) + &quot;%&quot;;
      }
      var num = el.querySelector ? el.querySelector(&quot;.v[data-to]&quot;) : null;
      if(num) countUp(num);
      io.unobserve(el);
    });
  }, {threshold:.28});
  document.querySelectorAll(&quot;.reveal&quot;).forEach(function(el){ io.observe(el); });

  /* ---------- 여정 카드 펼침 ---------- */
  document.querySelectorAll(&quot;.jcard&quot;).forEach(function(c){
    c.addEventListener(&quot;click&quot;, function(){ c.classList.toggle(&quot;open&quot;); });
  });

  /* ---------- 성과 카드 클릭 통통 ---------- */
  document.querySelectorAll(&quot;.stat&quot;).forEach(function(s){
    s.addEventListener(&quot;click&quot;, function(){
      s.classList.remove(&quot;pop&quot;); void s.offsetWidth; s.classList.add(&quot;pop&quot;);
    });
  });

  /* ---------- 파이프라인 노드 ---------- */
  var pd = document.getElementById(&quot;pipeDetail&quot;);
  document.querySelectorAll(&quot;.node&quot;).forEach(function(n){
    n.addEventListener(&quot;click&quot;, function(){
      document.querySelectorAll(&quot;.node&quot;).forEach(function(x){ x.classList.remove(&quot;active&quot;); });
      n.classList.add(&quot;active&quot;);
      pd.style.opacity = 0;
      setTimeout(function(){ pd.innerHTML = n.getAttribute(&quot;data-txt&quot;); pd.style.opacity = 1; }, 140);
    });
  });

  /* ---------- 자석 버튼/칩 ---------- */
  function magnet(el, inner, strength){
    if(coarse) return;
    el.addEventListener(&quot;pointermove&quot;, function(e){
      var r = el.getBoundingClientRect();
      var x = (e.clientX - r.left - r.width/2) * strength;
      var y = (e.clientY - r.top - r.height/2) * strength;
      inner.style.transform = &quot;translate(&quot; + x + &quot;px,&quot; + y + &quot;px)&quot;;
    });
    el.addEventListener(&quot;pointerleave&quot;, function(){ inner.style.transform = &quot;&quot;; });
  }
  document.querySelectorAll(&quot;.mag-btn&quot;).forEach(function(b){ magnet(b, b.querySelector(&quot;.mag&quot;), .3); });
  document.querySelectorAll(&quot;.mag-chip&quot;).forEach(function(c){ magnet(c, c, .18); });

  /* ---------- 커서 트레일 ---------- */
  if(!coarse &amp;&amp; !reduce){
    var cols = [&quot;var(--green)&quot;,&quot;var(--blue)&quot;,&quot;var(--purple)&quot;,&quot;var(--pink)&quot;,&quot;var(--amber)&quot;];
    var N = 6, dots = [], container = document.getElementById(&quot;trails&quot;);
    for(var i=0;i<N;i++){
      var d = document.createElement(&quot;div&quot;); d.className=&quot;trail&quot;;
      d.style.background = cols[i%cols.length]; d.style.transform=&quot;scale(&quot;+(1-i*0.12)+&quot;)&quot;;
      container.appendChild(d); dots.push({el:d,x:0,y:0});
    }
    var mx=innerWidth/2, my=innerHeight/2, active=false;
    addEventListener(&quot;pointermove&quot;, function(e){
      if(e.pointerType===&quot;touch&quot;) return;
      mx=e.clientX; my=e.clientY;
      if(!active){ active=true; dots.forEach(function(o){o.el.style.opacity=.7;}); }
    });
    (function loop(){
      var px=mx, py=my;
      dots.forEach(function(o){
        o.x += (px-o.x)*0.35; o.y += (py-o.y)*0.35;
        o.el.style.left=o.x+&quot;px&quot;; o.el.style.top=o.y+&quot;px&quot;;
        px=o.x; py=o.y;
      });
      requestAnimationFrame(loop);
    })();
  }

  /* ================= 히어로 로봇팔 IK 플레이그라운드 ================= */
  var svg = document.getElementById(&quot;scene&quot;);
  var bone1=document.getElementById(&quot;bone1&quot;), bone2=document.getElementById(&quot;bone2&quot;);
  var j1=document.getElementById(&quot;j1&quot;), grip=document.getElementById(&quot;grip&quot;);
  var grL=document.getElementById(&quot;grL&quot;), grR=document.getElementById(&quot;grR&quot;);
  var led=document.getElementById(&quot;led&quot;), ledGlow=document.getElementById(&quot;ledGlow&quot;), ledRays=document.getElementById(&quot;ledRays&quot;);
  var btnGroup=document.getElementById(&quot;btnGroup&quot;), btnTop=document.getElementById(&quot;btnTop&quot;),
      btnBase=document.getElementById(&quot;btnBase&quot;), btnGloss=document.getElementById(&quot;btnGloss&quot;), btnShadow=document.getElementById(&quot;btnShadow&quot;);
  var hint=document.getElementById(&quot;hint&quot;), cntEl=document.getElementById(&quot;cnt&quot;), counter=document.getElementById(&quot;counter&quot;);
  var sparks=document.getElementById(&quot;sparks&quot;);

  var BASE={x:112,y:70}, L1=150, L2=142;   // 팔 길이(최대 292 > 버튼거리 257, 여유 34)
  var HOME={x:288, y:258};            // 버튼 기본 위치 (버튼 top 중심)
  var PARK={x:200, y:150};            // 쉬는 자세 타겟(중앙 기판 위)
  var btn={x:HOME.x, y:HOME.y};       // 현재 버튼 위치
  var target={x:PARK.x, y:PARK.y};    // 팔이 노리는 목표(원함)
  var cur={x:PARK.x, y:PARK.y};       // 부드럽게 따라가는 실제 목표
  var dragging=false, userTook=false, pointerIn=false;
  var pressed=false, wasPressed=false, pressT=0;
  var count=0;

  function toSvg(cx, cy){
    var p = svg.createSVGPoint(); p.x=cx; p.y=cy;
    var m = svg.getScreenCTM(); if(!m) return null;
    var r = p.matrixTransform(m.inverse());
    return {x:r.x, y:r.y};
  }
  function clamp(v,a,b){ return v<a?a:(v>b?b:v); }

  // 포인터 → 버튼 히트 판정
  function hitBtn(pt){ return Math.hypot(pt.x-btn.x, pt.y-btn.y) < 24; }

  svg.addEventListener(&quot;pointerdown&quot;, function(e){
    var pt = toSvg(e.clientX, e.clientY); if(!pt) return;
    takeOver();
    if(hitBtn(pt)){
      dragging=true; btnGroup.style.cursor=&quot;grabbing&quot;;
      try{ svg.setPointerCapture(e.pointerId); }catch(_){}
    }
  });
  svg.addEventListener(&quot;pointermove&quot;, function(e){
    var pt = toSvg(e.clientX, e.clientY); if(!pt) return;
    pointerIn=true; takeOver();
    pt.x = clamp(pt.x, 64, 404); pt.y = clamp(pt.y, 58, 330);
    if(dragging){
      btn.x = clamp(pt.x, 96, 372); btn.y = clamp(pt.y, 236, 322);
      target.x = btn.x; target.y = btn.y - 2;
    } else {
      target.x = pt.x; target.y = pt.y;
    }
  });
  function endDrag(){
    if(dragging){ dragging=false; btnGroup.style.cursor=&quot;grab&quot;; }
  }
  svg.addEventListener(&quot;pointerup&quot;, endDrag);
  svg.addEventListener(&quot;pointercancel&quot;, endDrag);
  svg.addEventListener(&quot;pointerleave&quot;, function(){
    pointerIn=false; endDrag();
    if(userTook){ target.x=PARK.x; target.y=PARK.y; }
  });

  function takeOver(){
    if(userTook) return;
    userTook=true; hint.classList.add(&quot;hide&quot;);
  }

  function confetti(sx, sy){
    if(reduce) return;
    var cols=[&quot;var(--green)&quot;,&quot;var(--amber)&quot;,&quot;var(--blue)&quot;,&quot;var(--pink)&quot;,&quot;var(--purple)&quot;];
    for(var i=0;i<10;i++){
      var s=document.createElement(&quot;div&quot;); s.className=&quot;spark&quot;;
      s.style.left=(sx*100)+&quot;%&quot;; s.style.top=(sy*100)+&quot;%&quot;;
      s.style.background=cols[i%cols.length];
      var ang=Math.random()*Math.PI*2, dist=26+Math.random()*34;
      var dx=Math.cos(ang)*dist, dy=Math.sin(ang)*dist-14;
      s.style.transform=&quot;translate(-50%,-50%)&quot;;
      sparks.appendChild(s);
      (function(node,dx,dy){
        var st=performance.now(), dur=560+Math.random()*220;
        (function anim(now){
          var p=Math.min(1,(now-st)/dur), e=1-Math.pow(1-p,2);
          node.style.opacity=1-p;
          node.style.transform=&quot;translate(-50%,-50%) translate(&quot;+(dx*e)+&quot;px,&quot;+(dy*e+p*p*30)+&quot;px) rotate(&quot;+(p*260)+&quot;deg)&quot;;
          if(p<1) requestAnimationFrame(anim); else node.remove();
        })(st);
      })(s,dx,dy);
    }
  }

  function setLED(on){
    if(on){
      led.setAttribute(&quot;fill&quot;,&quot;url(#ledG)&quot;);
      ledGlow.setAttribute(&quot;opacity&quot;,&quot;0.85&quot;);
      ledRays.setAttribute(&quot;opacity&quot;,&quot;0.9&quot;);
    } else {
      led.setAttribute(&quot;fill&quot;,&quot;#0f4a2d&quot;);
      ledGlow.setAttribute(&quot;opacity&quot;,&quot;0&quot;);
      ledRays.setAttribute(&quot;opacity&quot;,&quot;0&quot;);
    }
  }

  // 아이들 데모 타임라인 (사용자 개입 전)
  function ease(t){ return t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2; }
  function idleTarget(now){
    var cyc=4600, t=(now % cyc)/cyc;
    var above={x:HOME.x, y:HOME.y-30};
    if(t<0.26){ var k=ease(t/0.26); return {x:PARK.x+(above.x-PARK.x)*k, y:PARK.y+(above.y-PARK.y)*k}; }
    if(t<0.40){ var k=ease((t-0.26)/0.14); return {x:above.x+(HOME.x-above.x)*k, y:above.y+(HOME.y-above.y)*k}; }
    if(t<0.56){ return {x:HOME.x, y:HOME.y}; }               // 눌러 유지
    if(t<0.74){ var k=ease((t-0.56)/0.18); return {x:HOME.x+(above.x-HOME.x)*k, y:HOME.y+(above.y-HOME.y)*k}; }
    var k=ease((t-0.74)/0.26); return {x:above.x+(PARK.x-above.x)*k, y:above.y+(PARK.y-above.y)*k};
  }

  function render(now){
    // 목표 결정
    if(!userTook &amp;&amp; !reduce){ var it=idleTarget(now); target.x=it.x; target.y=it.y; }

    // 부드러운 추종 (스프링 느낌)
    var k = reduce ? 1 : 0.20;
    cur.x += (target.x-cur.x)*k;
    cur.y += (target.y-cur.y)*k;

    // 2본 IK (팔꿈치 아래로 접힘)
    var dx=cur.x-BASE.x, dy=cur.y-BASE.y;
    var d=Math.hypot(dx,dy);
    d=clamp(d, Math.abs(L1-L2)+0.5, L1+L2-0.5);
    var ang=Math.atan2(dy,dx);
    var tx=BASE.x+Math.cos(ang)*d, ty=BASE.y+Math.sin(ang)*d;
    var cosA=clamp((L1*L1+d*d-L2*L2)/(2*L1*d), -1, 1);
    var A=Math.acos(cosA);
    var a1=ang - A;   // elbow-up: 위로 접어 버튼을 위에서 내리누르는 자세
    var ex=BASE.x+Math.cos(a1)*L1, ey=BASE.y+Math.sin(a1)*L1;
    var a2=Math.atan2(ty-ey, tx-ex);

    bone1.setAttribute(&quot;x1&quot;,BASE.x); bone1.setAttribute(&quot;y1&quot;,BASE.y);
    bone1.setAttribute(&quot;x2&quot;,ex);     bone1.setAttribute(&quot;y2&quot;,ey);
    bone2.setAttribute(&quot;x1&quot;,ex);     bone2.setAttribute(&quot;y1&quot;,ey);
    bone2.setAttribute(&quot;x2&quot;,tx);     bone2.setAttribute(&quot;y2&quot;,ty);
    j1.setAttribute(&quot;cx&quot;,ex);        j1.setAttribute(&quot;cy&quot;,ey);
    grip.setAttribute(&quot;transform&quot;,&quot;translate(&quot;+tx+&quot;,&quot;+ty+&quot;) rotate(&quot;+(a2*180/Math.PI-90)+&quot;)&quot;);

    // 버튼 위치 반영
    btnShadow.setAttribute(&quot;cx&quot;,btn.x); btnBase.setAttribute(&quot;cx&quot;,btn.x); btnTop.setAttribute(&quot;cx&quot;,btn.x); btnGloss.setAttribute(&quot;cx&quot;,btn.x-6);
    btnShadow.setAttribute(&quot;cy&quot;,btn.y+8); btnBase.setAttribute(&quot;cy&quot;,btn.y+4);

    // 버튼 원위치 스프링 복귀 (드래그 안 할 때)
    if(!dragging){
      btn.x += (HOME.x-btn.x)*(reduce?1:0.14);
      btn.y += (HOME.y-btn.y)*(reduce?1:0.14);
    }

    // 눌림 판정: 팁이 버튼 중심 근처
    pressed = Math.hypot(tx-btn.x, ty-btn.y) < 15;
    pressT += ((pressed?1:0) - pressT) * 0.3;

    // 버튼 눌림 시각화 + 그리퍼 오므림
    var depress = pressT*4;
    btnTop.setAttribute(&quot;cy&quot;, btn.y - 4 + depress);
    btnGloss.setAttribute(&quot;cy&quot;, btn.y - 10 + depress);
    grL.setAttribute(&quot;x&quot;, -9 + pressT*3.2); grR.setAttribute(&quot;x&quot;, 4 - pressT*3.2);

    setLED(pressT>0.55);

    // 눌림 상승엣지 → 카운트 + 컨페티
    if(pressed &amp;&amp; !wasPressed){
      count++; cntEl.textContent=count;
      counter.classList.remove(&quot;bump&quot;); void counter.offsetWidth; counter.classList.add(&quot;bump&quot;);
      var sx=btn.x/460, sy=btn.y/360;
      confetti(sx, sy);
    }
    wasPressed=pressed;

    requestAnimationFrame(render);
  }
  requestAnimationFrame(render);

  // &quot;직접 눌러보기&quot; 버튼 → 힌트 강조/스크롤 상단
  document.getElementById(&quot;tryBtn&quot;).addEventListener(&quot;click&quot;, function(e){
    e.preventDefault();
    document.getElementById(&quot;playCard&quot;).scrollIntoView({behavior: reduce?&quot;auto&quot;:&quot;smooth&quot;, block:&quot;center&quot;});
  });
})();
</script>

<script>
const D=["healthchecks 감각 · 수집→학습→측정→반복 데이터 흐름 + 로봇팔이 버튼 눌러 초록 LED","Linear/Vercel 다크 프리미엄 · 부팅 시퀀스·카운트업·커서 반응 로봇팔·S1 실행 버튼","잡지형 · 스크롤하면 로봇팔이 집기→버튼→케이블로 변신하는 3단계 여정","장난감 홈 · 버튼 가리키면 로봇팔이 IK로 따라와 누름 + 컨페티"];
const tabs=[...document.querySelectorAll('.tab')];
const frames=[...document.querySelectorAll('.frame')];
const desc=document.getElementById('desc');
let cur=0;
function show(i){
  cur=i;
  tabs.forEach((t,k)=>t.classList.toggle('active',k===i));
  frames.forEach((f,k)=>f.classList.toggle('hidden',k!==i));
  desc.textContent=D[i];
  const f=frames[i]; f.srcdoc=f.srcdoc; // 재로드 = 인트로 애니메이션 재생
}
tabs.forEach(t=>t.addEventListener('click',()=>show(+t.dataset.i)));
document.getElementById('replay').addEventListener('click',()=>show(cur));
window.addEventListener('keydown',e=>{const n=+e.key;if(n>=1&&n<=frames.length)show(n-1);});
document.getElementById('theme').addEventListener('click',()=>{
  const r=document.documentElement;
  const d=r.getAttribute('data-theme')==='light'?'':'light';
  d?r.setAttribute('data-theme',d):r.removeAttribute('data-theme');
});
</script>
