<style>html,body{margin:0;height:100%;background:#05070e;}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;}</style>
<iframe title="CoP 메인 3D" srcdoc="<!doctype html>
<html lang=&quot;ko&quot;>
<head>
<meta charset=&quot;utf-8&quot;>

<title>CoP Physical AI — 관제 콘솔</title>
<style>
  /* ============ 미션 컨트롤 / 텔레메트리 (시안 B · v2) ============ */
  :root{
    --bg:#05070e;
    --bg2:#080b15;
    --panel:#0b101c;
    --panel2:#0e1524;
    --line:rgba(150,175,220,.10);
    --line2:rgba(150,175,220,.18);
    --ink:#e8eefb;
    --mut:#8ea0bd;
    --mut2:#5f7091;
    --grn:#2ee6a0;
    --grn-dim:#1c9c6d;
    --cyn:#39c6f0;
    --amb:#f8b64c;
    --red:#ff6b6b;
    --glow:rgba(57,198,240,.55);
    --mono:ui-monospace,SFMono-Regular,&quot;SF Mono&quot;,Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,sans-serif;
    --mx:50%; --my:35%;      /* 커서 위치(그라디언트 추적) */
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:var(--sans);line-height:1.55;
    -webkit-font-smoothing:antialiased;overflow-x:hidden;
  }
  /* 커서 추적 배경 글로우 + 정밀 그리드 */
  .bg-fx{position:fixed;inset:0;z-index:0;pointer-events:none}
  .bg-fx .glow{
    position:absolute;inset:-20%;
    background:
      radial-gradient(420px 420px at var(--mx) var(--my), rgba(57,198,240,.16), transparent 60%),
      radial-gradient(680px 520px at calc(100% - var(--mx)) calc(var(--my) + 10%), rgba(46,230,160,.10), transparent 65%);
    transition:background .18s linear;
  }
  .bg-fx .grid{
    position:absolute;inset:0;opacity:.55;
    background-image:
      linear-gradient(var(--line) 1px,transparent 1px),
      linear-gradient(90deg,var(--line) 1px,transparent 1px);
    background-size:44px 44px;
    -webkit-mask-image:radial-gradient(1200px 800px at var(--mx) var(--my), #000 0%, rgba(0,0,0,.35) 55%, transparent 85%);
    mask-image:radial-gradient(1200px 800px at var(--mx) var(--my), #000 0%, rgba(0,0,0,.35) 55%, transparent 85%);
    transition:-webkit-mask-image .2s linear;
  }
  .bg-fx .vignette{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 0%,transparent 40%,var(--bg) 100%)}
  .wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:0 22px}

  /* ============ 부팅 오버레이 ============ */
  #boot{
    position:fixed;inset:0;z-index:100;background:var(--bg);
    display:flex;align-items:center;justify-content:center;
    transition:opacity .6s ease, visibility .6s;
  }
  #boot.done{opacity:0;visibility:hidden}
  .boot-inner{width:min(440px,86vw);font-family:var(--mono)}
  .boot-brand{font-size:13px;letter-spacing:.32em;color:var(--cyn);margin-bottom:18px}
  .boot-line{font-size:12.5px;color:var(--mut);margin:5px 0;display:flex;justify-content:space-between;opacity:0}
  .boot-line b{color:var(--ink);font-weight:600}
  .boot-line .ok{color:var(--grn)}
  .boot-bar{height:3px;background:var(--line2);border-radius:3px;margin-top:22px;overflow:hidden}
  .boot-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyn),var(--grn));box-shadow:0 0 12px var(--glow)}

  /* ============ 상단 관제 바 ============ */
  header{position:sticky;top:0;z-index:40;backdrop-filter:blur(12px);
    background:linear-gradient(var(--bg),rgba(5,7,14,.72));border-bottom:1px solid var(--line)}
  .nav{display:flex;align-items:center;gap:20px;height:60px}
  .brand{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-weight:700;font-size:14px;letter-spacing:.02em;white-space:nowrap}
  .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--grn);box-shadow:0 0 0 4px rgba(46,230,160,.15);animation:blink 2.4s infinite}
  .brand span{color:var(--mut2);font-weight:500}
  @keyframes blink{0%,92%,100%{opacity:1}94%{opacity:.25}}
  nav.links{display:flex;gap:2px;margin-left:auto;flex-wrap:wrap}
  nav.links a{color:var(--mut);text-decoration:none;font-size:12.5px;font-family:var(--mono);padding:7px 10px;border-radius:7px;transition:.15s;white-space:nowrap}
  nav.links a:hover{color:var(--ink);background:var(--panel2)}
  .sys-pill{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;color:var(--grn);border:1px solid var(--line2);border-radius:999px;padding:6px 12px;white-space:nowrap}
  .sys-pill .d{width:7px;height:7px;border-radius:50%;background:var(--grn);box-shadow:0 0 8px var(--grn);animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.75)}}
  .menubtn{display:none;margin-left:auto;background:var(--panel2);border:1px solid var(--line2);color:var(--ink);border-radius:8px;padding:8px 12px;font-family:var(--mono);font-size:12px;cursor:pointer}

  /* ============ 히어로 ============ */
  .hero{padding:46px 0 30px;position:relative}
  .hero-grid{display:grid;grid-template-columns:1.02fr 1fr;gap:34px;align-items:center}
  .eyebrow{display:inline-flex;align-items:center;gap:9px;font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;color:var(--cyn);
    border:1px solid var(--line2);border-radius:999px;padding:6px 13px;margin-bottom:20px}
  .eyebrow .sq{width:6px;height:6px;background:var(--cyn);box-shadow:0 0 8px var(--cyn)}
  h1{font-size:clamp(30px,5vw,52px);line-height:1.06;margin:0 0 16px;letter-spacing:-.02em;font-weight:800}
  h1 .hl{background:linear-gradient(120deg,var(--grn),var(--cyn));-webkit-background-clip:text;background-clip:text;color:transparent}
  .lede{color:var(--mut);font-size:16px;max-width:33em;margin:0 0 22px}
  .lede b{color:var(--ink);font-weight:600}
  .cta{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  .btn{font-family:var(--mono);font-size:13px;border-radius:10px;padding:12px 18px;cursor:pointer;border:1px solid transparent;text-decoration:none;display:inline-flex;align-items:center;gap:9px;transition:.16s}
  .btn.primary{background:linear-gradient(120deg,var(--grn),var(--cyn));color:#03130e;font-weight:700;box-shadow:0 8px 30px -10px var(--glow)}
  .btn.primary:hover{transform:translateY(-2px);box-shadow:0 14px 40px -12px var(--glow)}
  .btn.ghost{background:var(--panel);border-color:var(--line2);color:var(--ink)}
  .btn.ghost:hover{border-color:var(--cyn);color:var(--cyn)}
  .btn .ic{width:15px;height:15px;flex:none}

  .chips{display:flex;gap:10px;margin-top:26px;flex-wrap:wrap}
  .chip{font-family:var(--mono);font-size:11.5px;color:var(--mut);border:1px solid var(--line);border-radius:9px;padding:9px 12px;background:var(--panel);min-width:112px}
  .chip b{display:block;font-size:19px;color:var(--ink);font-weight:700;margin-top:3px}
  .chip .u{color:var(--grn)}

  /* ============ 관제 콘솔(로봇팔 + 텔레메트리) ============ */
  .console{position:relative;border:1px solid var(--line2);border-radius:18px;
    background:linear-gradient(180deg,var(--panel2),var(--panel));overflow:hidden;
    box-shadow:0 30px 80px -40px #000, inset 0 1px 0 rgba(255,255,255,.03)}
  .console .top{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:11px;color:var(--mut2)}
  .console .top .lamp{width:8px;height:8px;border-radius:50%}
  .lamp.g{background:var(--grn);box-shadow:0 0 8px var(--grn)}
  .lamp.a{background:var(--amb)}
  .lamp.r{background:var(--red)}
  .console .top .rt{margin-left:auto;color:var(--grn)}
  .stage-svg{display:block;width:100%;height:auto;background:
    radial-gradient(80% 60% at 50% 30%,rgba(57,198,240,.06),transparent 70%)}
  .stage-svg text{font-family:var(--mono)}
  /* 3D 히어로 로봇팔 캔버스 (arm3d.js) — 옛 2D SVG 팔 자리/비율 유지 */
  #hero3d{display:block;width:100%;aspect-ratio:460/312;touch-action:none;cursor:grab;
    background:radial-gradient(80% 60% at 50% 30%,rgba(57,198,240,.07),transparent 70%),linear-gradient(180deg,#0a0f1c,#070b14)}
  #hero3d:active{cursor:grabbing}

  /* 텔레메트리 오버레이(콘솔 위 코너 위젯) */
  .tele{position:absolute;font-family:var(--mono);pointer-events:none}
  .tele.tl{top:52px;left:14px}
  .tele.tr{top:52px;right:14px;text-align:right}
  .tele .lab{font-size:9.5px;letter-spacing:.12em;color:var(--mut2)}
  .tele .val{font-size:26px;font-weight:700;color:var(--ink);line-height:1.1}
  .tele .val .s{font-size:14px;color:var(--grn)}
  .spark{display:block;margin-top:4px}
  .tele.tr .spark{margin-left:auto}

  .console .foot{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
  .runbtn{font-family:var(--mono);font-size:12px;border:1px solid var(--grn);color:var(--grn);background:rgba(46,230,160,.08);
    border-radius:9px;padding:9px 14px;cursor:pointer;display:inline-flex;gap:8px;align-items:center;transition:.16s}
  .runbtn:hover{background:rgba(46,230,160,.16);box-shadow:0 0 24px -6px var(--grn)}
  .foot .status{font-family:var(--mono);font-size:11px;color:var(--mut)}
  .foot .status b{color:var(--grn)}
  .foot .playlab{font-family:var(--mono);font-size:11px;color:var(--grn);display:inline-flex;align-items:center;gap:7px}
  .foot .playlab .d{width:7px;height:7px;border-radius:50%;background:var(--grn);box-shadow:0 0 8px var(--grn);animation:pulse 1.6s infinite}

  /* ============ 로그 콘솔 (실 학습로그 재생) ============ */
  .logbox{margin-top:14px;border:1px solid var(--line);border-radius:12px;background:#070a12;font-family:var(--mono);font-size:11.5px;overflow:hidden}
  .logbox .lh{display:flex;gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line);color:var(--mut2);font-size:10.5px;letter-spacing:.1em;flex-wrap:wrap}
  .logbox .lh .rep{color:var(--grn);display:inline-flex;align-items:center;gap:6px}
  .logbox .lh .rep .d{width:7px;height:7px;border-radius:50%;background:var(--grn);box-shadow:0 0 8px var(--grn);animation:pulse 1.6s infinite}
  .logbox .lh .sk{margin-left:auto}
  .statstrip{display:flex;gap:0;flex-wrap:wrap;border-bottom:1px solid var(--line);font-family:var(--mono)}
  .statstrip .st{flex:1;min-width:96px;padding:9px 12px;border-right:1px solid var(--line)}
  .statstrip .st:last-child{border-right:0}
  .statstrip .st .k{font-size:9px;letter-spacing:.1em;color:var(--mut2)}
  .statstrip .st .v{font-size:16px;font-weight:700;color:var(--ink);margin-top:2px}
  .statstrip .st .v.g{color:var(--grn)} .statstrip .st .v.c{color:var(--cyn)} .statstrip .st .v.a{color:var(--amb)}
  .log{padding:10px 12px;height:120px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
  .log div{margin:2px 0;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .log .t{color:var(--mut2)}
  .log .ok{color:var(--grn)} .log .cy{color:var(--cyn)} .log .am{color:var(--amb)} .log .ink{color:var(--ink)}

  /* ============ 섹션 공통 ============ */
  section.blk{padding:64px 0;border-top:1px solid var(--line);position:relative}
  .sechead{display:flex;align-items:baseline;gap:14px;margin-bottom:30px;flex-wrap:wrap}
  .sechead .idx{font-family:var(--mono);font-size:12px;color:var(--cyn);letter-spacing:.1em}
  .sechead h2{font-size:clamp(22px,3.4vw,30px);margin:0;letter-spacing:-.01em;font-weight:750}
  .sechead p{color:var(--mut);font-size:13.5px;margin:0}
  .reveal{opacity:0;transform:translateY(22px);transition:opacity .7s cubic-bezier(.2,.7,.2,1),transform .7s cubic-bezier(.2,.7,.2,1)}
  .reveal.in{opacity:1;transform:none}

  /* ============ 3단계 관제 카드 ============ */
  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .card{border:1px solid var(--line2);border-radius:14px;background:linear-gradient(180deg,var(--panel2),var(--panel));padding:18px;position:relative;overflow:hidden;transition:.2s}
  .card:hover{transform:translateY(-4px);border-color:var(--line2)}
  .card::before{content:&quot;&quot;;position:absolute;left:0;top:0;bottom:0;width:3px}
  .card.done::before{background:var(--grn);box-shadow:0 0 16px var(--grn)}
  .card.live::before{background:var(--amb);box-shadow:0 0 16px var(--amb)}
  .card.next::before{background:var(--mut2)}
  .card .ph{font-family:var(--mono);font-size:11px;color:var(--mut2);letter-spacing:.08em;display:flex;justify-content:space-between}
  .badge{font-family:var(--mono);font-size:10px;padding:3px 8px;border-radius:999px}
  .badge.g{color:var(--grn);border:1px solid var(--grn-dim);background:rgba(46,230,160,.08)}
  .badge.a{color:var(--amb);border:1px solid rgba(248,182,76,.4);background:rgba(248,182,76,.08)}
  .badge.n{color:var(--mut);border:1px solid var(--line2)}
  .card h3{font-size:17px;margin:12px 0 4px;font-weight:700}
  .card .sub{color:var(--mut);font-size:13px;min-height:38px}
  .card .metric{font-family:var(--mono);margin-top:14px;display:flex;align-items:baseline;gap:8px}
  .card .metric .n{font-size:30px;font-weight:800}
  .card.done .metric .n{color:var(--grn)} .card.live .metric .n{color:var(--amb)} .card.next .metric .n{color:var(--mut)}
  .card .metric .k{font-size:11px;color:var(--mut2)}
  .prog{height:6px;border-radius:6px;background:var(--line);margin-top:12px;overflow:hidden}
  .prog i{display:block;height:100%;width:0;border-radius:6px;transition:width 1.1s cubic-bezier(.2,.7,.2,1)}
  .card.done .prog i{background:linear-gradient(90deg,var(--grn-dim),var(--grn))}
  .card.live .prog i{background:linear-gradient(90deg,#b9812a,var(--amb))}
  .card.next .prog i{background:var(--mut2)}

  /* ============ 성과 지표(게이지) ============ */
  .metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
  .gcard{border:1px solid var(--line2);border-radius:14px;background:linear-gradient(180deg,var(--panel2),var(--panel));padding:20px;text-align:center}
  .gwrap{position:relative;width:132px;height:132px;margin:0 auto}
  .gwrap svg{transform:rotate(-90deg)}
  .gwrap .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .gwrap .ctr .big{font-family:var(--mono);font-size:25px;font-weight:800}
  .gwrap .ctr .u{font-family:var(--mono);font-size:11px;color:var(--mut2)}
  .gcard .cap{margin-top:12px;font-size:13px;color:var(--ink);font-weight:600}
  .gcard .cap span{display:block;font-family:var(--mono);font-size:10.5px;color:var(--mut2);font-weight:400;margin-top:2px}

  /* ============ 파이프라인 ============ */
  .pipe{border:1px solid var(--line2);border-radius:16px;background:linear-gradient(180deg,var(--panel2),var(--panel));padding:26px 22px 30px;position:relative;overflow:hidden}
  .pipe .lead{font-family:var(--mono);font-size:12px;color:var(--mut);margin-bottom:26px;display:flex;align-items:center;gap:9px}
  .pipe .lead .d{width:8px;height:8px;border-radius:50%;background:var(--grn);box-shadow:0 0 10px var(--grn);animation:pulse 1.6s infinite}
  .flow{display:grid;grid-template-columns:repeat(4,1fr);gap:0;position:relative;align-items:center}
  .node{position:relative;text-align:center;z-index:2}
  .node .ring{width:64px;height:64px;border-radius:16px;margin:0 auto 12px;border:1px solid var(--line2);background:var(--panel);
    display:flex;align-items:center;justify-content:center;position:relative;transition:.3s}
  .node.hot .ring{border-color:var(--grn);box-shadow:0 0 26px -4px var(--grn);background:rgba(46,230,160,.07)}
  .node .ring svg{width:30px;height:30px}
  .node .nm{font-family:var(--mono);font-size:13px;font-weight:700}
  .node .dsc{font-family:var(--mono);font-size:10.5px;color:var(--mut2);margin-top:3px}
  .track{position:absolute;left:0;right:0;top:32px;height:2px;z-index:1}
  .track .base{position:absolute;left:12.5%;right:12.5%;top:0;height:2px;
    background:repeating-linear-gradient(90deg,var(--line2) 0 7px,transparent 7px 15px);background-size:15px 2px;
    animation:dash 1s linear infinite}
  @keyframes dash{to{background-position:15px 0}}
  .packet{position:absolute;top:-4px;left:12.5%;width:11px;height:11px;border-radius:50%;
    background:var(--grn);box-shadow:0 0 14px var(--grn);z-index:3;
    animation:travel 5.2s linear infinite}
  @keyframes travel{
    0%{left:12.5%;opacity:0}5%{opacity:1}
    28%{left:37.5%}52%{left:62.5%}76%{left:87.5%}
    92%{left:87.5%;opacity:1}100%{left:87.5%;opacity:0}}
  .loopback{font-family:var(--mono);font-size:11px;color:var(--grn);text-align:center;margin-top:24px;display:flex;align-items:center;justify-content:center;gap:9px}
  .loopback .arc{width:120px;height:1px;background:repeating-linear-gradient(90deg,var(--grn-dim) 0 6px,transparent 6px 12px);animation:dash 1s linear infinite}

  /* ============ 탐색 메뉴 그리드(푸터) ============ */
  footer{border-top:1px solid var(--line);padding:52px 0 40px;position:relative}
  .mapgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:34px}
  .mapgrid a{display:block;border:1px solid var(--line);border-radius:11px;background:var(--panel);padding:15px;text-decoration:none;transition:.16s}
  .mapgrid a:hover{border-color:var(--cyn);transform:translateY(-3px);background:var(--panel2)}
  .mapgrid .k{font-family:var(--mono);font-size:10px;color:var(--cyn);letter-spacing:.1em}
  .mapgrid .t{font-size:14px;color:var(--ink);font-weight:650;margin-top:6px}
  .mapgrid .a{font-size:11.5px;color:var(--mut2);margin-top:2px}
  .foot-b{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-family:var(--mono);font-size:11.5px;color:var(--mut2);border-top:1px solid var(--line);padding-top:22px}
  .foot-b b{color:var(--mut)}

  /* ============ 토스트 ============ */
  .toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(16px);z-index:120;
    background:var(--panel2);border:1px solid var(--line2);color:var(--ink);font-family:var(--mono);font-size:12.5px;
    padding:11px 18px;border-radius:11px;box-shadow:0 18px 50px -20px #000, 0 0 22px -10px var(--glow);
    opacity:0;pointer-events:none;transition:opacity .25s, transform .25s;display:flex;align-items:center;gap:9px}
  .toast .d{width:7px;height:7px;border-radius:50%;background:var(--cyn);box-shadow:0 0 8px var(--cyn)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* ============ 반응형 ============ */
  @media(max-width:900px){
    .hero-grid{grid-template-columns:1fr;gap:26px}
    nav.links{display:none}
    nav.links.open{display:flex;position:absolute;top:60px;left:0;right:0;background:var(--bg2);border-bottom:1px solid var(--line2);padding:12px;flex-direction:column;gap:2px}
    .menubtn{display:block}
    .metrics{grid-template-columns:repeat(2,1fr)}
  }
  @media(max-width:640px){
    .cards{grid-template-columns:1fr}
    .metrics{grid-template-columns:repeat(2,1fr)}
    .mapgrid{grid-template-columns:repeat(2,1fr)}
    .flow .node .dsc{display:none}
    .tele .val{font-size:20px}
    h1{font-size:29px}
  }
  @media(prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
    .reveal{opacity:1;transform:none}
    .bg-fx .grid,.bg-fx .glow{transition:none}
  }
</style>
</head>
<body>

<!-- 배경 FX (커서 추적 그리드/글로우) -->
<div class=&quot;bg-fx&quot; aria-hidden=&quot;true&quot;>

<script>
(function(){
  &quot;use strict&quot;;
  var RM = window.matchMedia(&quot;(prefers-reduced-motion: reduce)&quot;).matches;
  var TL = REAL.train_log;

  /* ---------- 부팅 시퀀스 ---------- */
  var boot=document.getElementById(&quot;boot&quot;), bar=document.getElementById(&quot;bootbar&quot;);
  var blines=document.querySelectorAll(&quot;[data-b]&quot;);
  function finishBoot(){ boot.classList.add(&quot;done&quot;); startAll(); }
  if(RM){ boot.style.transition=&quot;none&quot;; finishBoot(); }
  else{
    blines.forEach(function(l,i){ setTimeout(function(){ l.style.transition=&quot;opacity .3s&quot;; l.style.opacity=&quot;1&quot;; }, 180+i*230); });
    if(bar){ bar.style.transition=&quot;width 1.5s cubic-bezier(.4,0,.2,1)&quot;; requestAnimationFrame(function(){ bar.style.width=&quot;100%&quot;; }); }
    setTimeout(finishBoot, 1750);
  }

  /* ---------- 커서 추적 배경 ---------- */
  var root=document.documentElement;
  if(!RM){
    window.addEventListener(&quot;pointermove&quot;, function(e){
      root.style.setProperty(&quot;--mx&quot;,(e.clientX/window.innerWidth*100)+&quot;%&quot;);
      root.style.setProperty(&quot;--my&quot;,(e.clientY/window.innerHeight*100)+&quot;%&quot;);
    }, {passive:true});
  }

  /* ---------- 시계 ---------- */
  var clk=document.getElementById(&quot;clock&quot;);
  function tick(){ if(!clk)return; var d=new Date();
    clk.textContent=[d.getHours(),d.getMinutes(),d.getSeconds()].map(function(n){return(n<10?&quot;0&quot;:&quot;&quot;)+n}).join(&quot;:&quot;); }
  tick(); setInterval(tick,1000);

  /* ---------- 카운트업 ---------- */
  function countUp(el){
    var target=parseFloat(el.getAttribute(&quot;data-count&quot;));
    var dec=parseInt(el.getAttribute(&quot;data-dec&quot;)||&quot;0&quot;,10);
    if(RM){ el.textContent=target.toFixed(dec); return; }
    var start=performance.now(), dur=1300;
    function step(now){
      var p=Math.min((now-start)/dur,1), e=1-Math.pow(1-p,3);
      el.textContent=(target*e).toFixed(dec);
      if(p<1) requestAnimationFrame(step); else el.textContent=target.toFixed(dec);
    }
    requestAnimationFrame(step);
  }

  /* ---------- 게이지 렌더 ---------- */
  var colMap={grn:&quot;var(--grn)&quot;,amb:&quot;var(--amb)&quot;,cyn:&quot;var(--cyn)&quot;};
  function buildGauge(card){
    var wrap=card.querySelector(&quot;.gwrap&quot;);
    var pct=parseFloat(card.getAttribute(&quot;data-g&quot;));
    var col=colMap[card.getAttribute(&quot;data-col&quot;)]||&quot;var(--grn)&quot;;
    var manual=card.getAttribute(&quot;data-manual&quot;);
    var suffix=card.getAttribute(&quot;data-suffix&quot;);
    var r=54, C=2*Math.PI*r;
    wrap.innerHTML=
      '<svg width=&quot;132&quot; height=&quot;132&quot; viewBox=&quot;0 0 132 132&quot;>'+
      '<circle cx=&quot;66&quot; cy=&quot;66&quot; r=&quot;'+r+'&quot; fill=&quot;none&quot; stroke=&quot;var(--line2)&quot; stroke-width=&quot;9&quot;/>'+
      '<circle class=&quot;arc&quot; cx=&quot;66&quot; cy=&quot;66&quot; r=&quot;'+r+'&quot; fill=&quot;none&quot; stroke=&quot;'+col+'&quot; stroke-width=&quot;9&quot; stroke-linecap=&quot;round&quot; '+
      'stroke-dasharray=&quot;'+C+'&quot; stroke-dashoffset=&quot;'+C+'&quot; style=&quot;filter:drop-shadow(0 0 6px '+col+')&quot;/></svg>'+
      '<div class=&quot;ctr&quot;><div class=&quot;big&quot; style=&quot;color:'+col+'&quot;>'+(manual||&quot;0&quot;)+'</div><div class=&quot;u&quot;>'+(suffix||(manual?&quot;&quot;:&quot;%&quot;))+'</div></div>';
    var arc=wrap.querySelector(&quot;.arc&quot;);
    var big=wrap.querySelector(&quot;.big&quot;);
    var off=C*(1-pct/100);
    if(RM){ arc.style.strokeDashoffset=off; if(!manual) big.textContent=pct%1?pct.toFixed(1):pct.toFixed(0); return; }
    arc.style.transition=&quot;stroke-dashoffset 1.4s cubic-bezier(.2,.7,.2,1)&quot;;
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ arc.style.strokeDashoffset=off; }); });
    if(!manual){
      var s=performance.now();
      (function anim(now){ var p=Math.min((now-s)/1400,1),e=1-Math.pow(1-p,3);
        big.textContent=(pct*e).toFixed(pct%1?1:0);
        if(p<1)requestAnimationFrame(anim); else big.textContent=pct%1?pct.toFixed(1):pct.toFixed(0);
      })(s);
    }
  }

  /* ---------- 스파크라인: 데이터로 polyline points 생성 + draw ---------- */
  function mapPoints(vals, w, h, pad){
    var mn=Math.min.apply(null,vals), mx=Math.max.apply(null,vals), rng=(mx-mn)||1;
    var n=vals.length, out=[];
    for(var i=0;i<n;i++){
      var x=(n===1)?0:(i/(n-1))*(w-1);
      var y=(h-pad)-((vals[i]-mn)/rng)*(h-2*pad);
      out.push(x.toFixed(1)+&quot;,&quot;+y.toFixed(1));
    }
    return out.join(&quot; &quot;);
  }
  function drawSpark(pl){
    if(!pl)return;
    if(RM){ return; }
    var len=pl.getTotalLength();
    pl.style.strokeDasharray=len; pl.style.strokeDashoffset=len;
    pl.style.transition=&quot;stroke-dashoffset 1.4s ease .3s&quot;;
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ pl.style.strokeDashoffset=0; }); });
  }
  function buildSparks(){
    // 손실 곡선(로그 스케일): 74.5 -> 0.013 급강하
    var lossLog = TL.map(function(r){ return Math.log10(r.loss); });
    var loss1=document.getElementById(&quot;spkLoss&quot;);
    var loss2=document.getElementById(&quot;spkLossBig&quot;);
    if(loss1){ loss1.setAttribute(&quot;points&quot;, mapPoints(lossLog,112,26,3)); }
    if(loss2){ loss2.setAttribute(&quot;points&quot;, mapPoints(lossLog,150,24,3)); }
    // 4-seed 성공(9,10,8,10 → %) 스파크
    var succ=[90,100,80,100];
    var sp=document.getElementById(&quot;spkSucc&quot;);
    if(sp){ sp.setAttribute(&quot;points&quot;, mapPoints(succ,112,26,3)); }
    [loss1,loss2,sp].forEach(drawSpark);
  }

  /* 로봇팔: 실측 rollout 3D 재생은 arm3d.js(canvas#hero3d)가 담당 */

  /* ---------- 로그 콘솔: 실 train_log 재생 ---------- */
  var logEl=document.getElementById(&quot;log&quot;);
  function pad2(n){ return (n<10?&quot;0&quot;:&quot;&quot;)+n; }
  function lossStr(v){ return v>=10? v.toFixed(1) : v>=1? v.toFixed(2) : v.toFixed(3); }
  function lossCls(v){ return v>1? &quot;am&quot; : v<0.05? &quot;ok&quot; : &quot;cy&quot;; }
  function addLogRow(r){
    var d=document.createElement(&quot;div&quot;);
    var mins=(r.sec/60);
    function span(cls,txt){ var s=document.createElement(&quot;span&quot;); if(cls)s.className=cls; s.textContent=txt; return s; }
    d.appendChild(span(&quot;t&quot;,&quot;epoch &quot;+pad2(r.epoch)+&quot; &quot;));
    d.appendChild(document.createTextNode(&quot;· loss &quot;));
    d.appendChild(span(lossCls(r.loss), lossStr(r.loss)));
    d.appendChild(document.createTextNode(&quot; · l1 &quot;));
    d.appendChild(span(&quot;cy&quot;, r.l1.toFixed(4)));
    d.appendChild(span(&quot;t&quot;, &quot; · &quot;+mins.toFixed(1)+&quot;min&quot;));
    logEl.appendChild(d);
    while(logEl.children.length>6) logEl.removeChild(logEl.firstChild);
  }
  var li=0, logTimer=null;
  function feedLog(){
    addLogRow(TL[li%TL.length]); li++;
    logTimer=setTimeout(feedLog, 820);
  }

  /* ---------- CTA 토스트 (대상 페이지 곧 공개) ---------- */
  var toastEl=null, toastTimer=null;
  function toast(msg){
    if(!toastEl){ toastEl=document.createElement(&quot;div&quot;); toastEl.className=&quot;toast&quot;;
      toastEl.innerHTML='<i class=&quot;d&quot;></i><span></span>'; document.body.appendChild(toastEl); }
    toastEl.querySelector(&quot;span&quot;).textContent=msg;
    toastEl.classList.add(&quot;show&quot;);
    clearTimeout(toastTimer); toastTimer=setTimeout(function(){ toastEl.classList.remove(&quot;show&quot;); }, 2200);
  }
  function wireToast(el){
    if(!el) return;
    el.addEventListener(&quot;click&quot;, function(ev){
      var href=el.getAttribute(&quot;href&quot;)||&quot;&quot;;
      var id=href.charAt(0)===&quot;#&quot;?href.slice(1):&quot;&quot;;
      if(id &amp;&amp; !document.getElementById(id)){ ev.preventDefault();
        toast(el.getAttribute(&quot;data-toast&quot;)|| (el.textContent.trim()+&quot; — 곧 공개됩니다&quot;)); }
    });
  }
  wireToast(document.getElementById(&quot;ctaStory&quot;));
  wireToast(document.getElementById(&quot;ctaPlay&quot;));
  document.querySelectorAll(&quot;.mapgrid a[data-toast]&quot;).forEach(wireToast);

  /* ---------- 스크롤 리빌 + 지연 로드 ---------- */
  var io=new IntersectionObserver(function(ents){
    ents.forEach(function(en){
      if(!en.isIntersecting) return;
      var el=en.target;
      el.classList.add(&quot;in&quot;);
      var pi=el.querySelector(&quot;.prog i&quot;);
      if(pi){ setTimeout(function(){ pi.style.width=pi.getAttribute(&quot;data-w&quot;)+&quot;%&quot;; },120); }
      if(el.classList.contains(&quot;gcard&quot;) &amp;&amp; !el.dataset.built){ el.dataset.built=&quot;1&quot;; buildGauge(el); }
      el.querySelectorAll(&quot;[data-count]&quot;).forEach(function(c){ if(!c.dataset.done){ c.dataset.done=&quot;1&quot;; countUp(c);} });
      io.unobserve(el);
    });
  },{threshold:0.25});
  document.querySelectorAll(&quot;.reveal&quot;).forEach(function(e){ io.observe(e); });

  /* ---------- 모바일 메뉴 ---------- */
  var mb=document.getElementById(&quot;menubtn&quot;), lk=document.getElementById(&quot;links&quot;);
  if(mb) mb.addEventListener(&quot;click&quot;, function(){ lk.classList.toggle(&quot;open&quot;); });
  lk &amp;&amp; lk.addEventListener(&quot;click&quot;, function(e){ if(e.target.tagName===&quot;A&quot;) lk.classList.remove(&quot;open&quot;); });

  /* ---------- 전체 시작(부팅 후) ---------- */
  function startAll(){
    document.querySelectorAll(&quot;.hero [data-count], header [data-count]&quot;).forEach(function(c){ if(!c.dataset.done){ c.dataset.done=&quot;1&quot;; countUp(c);} });
    buildSparks();
    if(RM){
      // 감속 모드: 로그 마지막 줄들 채움 (팔은 arm3d.js가 정적 렌더)
      for(var k=Math.max(0,TL.length-6);k<TL.length;k++) addLogRow(TL[k]);
      return;
    }
    feedLog();
  }
})();

    var liftG = new THREE.Group(); liftG.position.set(0, 0.02, 0); panG.add(liftG);
    var upA = mkMetal(THREE, COL.metal2), x0 = 0.028;
    var barA = box(THREE, L_UP, 0.014, 0.012, upA); barA.position.set(x0 + L_UP / 2, 0, 0.014); liftG.add(barA);
    var barB = box(THREE, L_UP, 0.014, 0.012, upA); barB.position.set(x0 + L_UP / 2, 0, -0.014); liftG.add(barB);

    /* elbowG: 피치(Z) (elbow_flex) — lower_arm 단일 바 */
    var elbowG = new THREE.Group(); elbowG.position.set(x0 + L_UP, 0, 0); liftG.add(elbowG);
    var elServo = servo(THREE, 0.042, 0.044, 0.05); elbowG.add(elServo);
    var x1 = 0.024, lowerBar = box(THREE, L_LO, 0.03, 0.024, mkMetal(THREE, COL.metal)); lowerBar.position.set(x1 + L_LO / 2, 0, 0); elbowG.add(lowerBar);

    /* wflexG: 피치(Z) (wrist_flex) — wrist 링크 */
    var wflexG = new THREE.Group(); wflexG.position.set(x1 + L_LO, 0, 0); elbowG.add(wflexG);
    var wrServo = servo(THREE, 0.04, 0.04, 0.044); wflexG.add(wrServo);
    var x2 = 0.022, wristLink = box(THREE, L_WR, 0.026, 0.022, mkMetal(THREE, COL.metal2)); wristLink.position.set(x2 + L_WR / 2, 0, 0); wflexG.add(wristLink);

    /* rollG: 팔 축(X) 롤 (wrist_roll) → 그리퍼 */
    var rollG = new THREE.Group(); rollG.position.set(x2 + L_WR, 0, 0); wflexG.add(rollG);
    var collar = new THREE.Mesh(new THREE.CylinderGeometry(0.016, 0.016, 0.024, 18), mkMetal(THREE, COL.metal));
    collar.rotation.z = Math.PI / 2; collar.position.x = 0.012; rollG.add(collar);
    var gbase = box(THREE, 0.024, 0.03, 0.03, mkMetal(THREE, COL.metal2)); gbase.position.x = 0.03; rollG.add(gbase);

    /* 고정 아래턱: 검은 갈고리(뾰족) — 정지 */
    var hookMat = mkMetal(THREE, COL.hook);
    var jbase = box(THREE, 0.05, 0.012, 0.02, hookMat); jbase.position.set(0.065, -0.012, 0); rollG.add(jbase);
    var jtip = box(THREE, 0.03, 0.01, 0.016, hookMat); jtip.position.set(0.093, -0.02, 0); jtip.rotation.z = -0.5; rollG.add(jtip);

    /* 이동 위턱: 흰색(경첩) — jawG 만 gripper qpos로 여닫음 */
    var jawG = new THREE.Group(); jawG.position.set(0.05, 0.006, 0); rollG.add(jawG);
    var jawTop = box(THREE, 0.044, 0.011, 0.02, new THREE.MeshStandardMaterial({ color: COL.jaw, metalness: 0.3, roughness: 0.35 }));
    jawTop.position.set(0.022, 0, 0); jawG.add(jawTop);

    /* ── PCB 무대: 어두운 초록 기판 + 리셋버튼(빨강) + LED ── */
    var pcb = RT.pcb || { x: 0.27, y: 0, yaw_deg: 0 };
    var pcbG = new THREE.Group();
    pcbG.position.set(pcb.x, 0.004, pcb.y);
    pcbG.rotation.y = -(pcb.yaw_deg || 0) * Math.PI / 180;
    var board = box(THREE, 0.15, 0.008, 0.14, new THREE.MeshStandardMaterial({ color: COL.pcb, roughness: 0.7, metalness: 0.1 }));
    board.receiveShadow = true; pcbG.add(board);
    var btn = new THREE.Mesh(new THREE.CylinderGeometry(0.014, 0.014, 0.012, 20),
      new THREE.MeshStandardMaterial({ color: COL.btn, emissive: 0x5a1414, roughness: 0.5 }));
    btn.position.set(0, 0.01, 0); pcbG.add(btn);
    var led = new THREE.Mesh(new THREE.CylinderGeometry(0.01, 0.01, 0.008, 16),
      new THREE.MeshStandardMaterial({ color: COL.ledOff, emissive: 0x000000, emissiveIntensity: 0 }));
    led.position.set(0.05, 0.008, 0); pcbG.add(led);

    return {
      armRoot: armRoot, pcbG: pcbG,
      joints: { panG: panG, liftG: liftG, elbowG: elbowG, wflexG: wflexG, rollG: rollG, jawG: jawG },
      led: led, btn: btn
    };
  }

  /* ── 순수 FK: qpos6 → 각 Group 회전(6개 값 전부 사용) ── */
  function applyFK(J, q) {
    J.panG.rotation.y   = CAL.pan.s   * q[0] + CAL.pan.o;
    J.liftG.rotation.z  = CAL.lift.s  * q[1] + CAL.lift.o;
    J.elbowG.rotation.z = CAL.elbow.s * q[2] + CAL.elbow.o;
    J.wflexG.rotation.z = CAL.wf.s    * q[3] + CAL.wf.o;
    J.rollG.rotation.x  = CAL.roll.s  * q[4] + CAL.roll.o;
    J.jawG.rotation.z   = -Math.max(0, q[5]) * CAL.jawGain;   // 위턱만 개구
  }

  /* ── LED 점등 토글(led_frame 이후) ── */
  function setLED(A, on) {
    var m = A.led.material;
    if (on) { m.color.setHex(COL.ledOn); m.emissive.setHex(COL.ledOn); m.emissiveIntensity = 1.15; }
    else    { m.color.setHex(COL.ledOff); m.emissive.setHex(0x000000); m.emissiveIntensity = 0; }
  }

  /* ── 브라우저 부팅: 씬 + 오빗 + 재생루프 ─────────────────────────────── */
  function initHero3D() {
    var THREE = global.THREE, RT = global.REAL_TRAJ;
    var canvas = document.getElementById(&quot;hero3d&quot;);
    if (!THREE || !RT || !canvas) return;

    var RM = global.matchMedia &amp;&amp; global.matchMedia(&quot;(prefers-reduced-motion: reduce)&quot;).matches;
    var FR = RT.frames, FPS = RT.fps || 29.41, N = RT.n || FR.length, LEDF = RT.led_frame || 0;

    var W = canvas.clientWidth || 460, H = canvas.clientHeight || 312;
    var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(global.devicePixelRatio || 1, 2));
    renderer.setSize(W, H, false);
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    var scene = new THREE.Scene();               // 배경 투명 → 콘솔 딥네이비가 비침
    scene.add(new THREE.HemisphereLight(0x2a3a4a, 0x05070e, 0.55));
    var key = new THREE.DirectionalLight(0xbfe9ff, 0.95); key.position.set(0.6, 1.2, 0.8); scene.add(key);
    var rimC = new THREE.DirectionalLight(0x39c6f0, 0.6); rimC.position.set(-0.7, 0.5, -0.9); scene.add(rimC);   // 시안 림
    var rimM = new THREE.DirectionalLight(0x2ee6a0, 0.4); rimM.position.set(-0.4, 0.2, 0.6); scene.add(rimM);    // 민트 림

    var grid = new THREE.GridHelper(1.4, 28, 0x1c3a4a, 0x12202c); grid.position.y = 0.0005; scene.add(grid);

    var A = buildArm(THREE, RT);
    scene.add(A.armRoot); scene.add(A.pcbG);

    var camera = new THREE.PerspectiveCamera(42, W / H, 0.01, 20);
    /* 오빗(직접 구현): az=방위, el=고도, dist=줌. 카메라 초기 각도 = 팔+PCB 보기좋게 */
    var target = new THREE.Vector3(0.14, 0.1, 0);
    var az = 0.92, el = 0.34, dist = 0.6;
    function applyCam() {
      camera.position.set(
        target.x + dist * Math.cos(el) * Math.sin(az),
        target.y + dist * Math.sin(el),
        target.z + dist * Math.cos(el) * Math.cos(az));
      camera.lookAt(target);
      renderer.render(scene, camera);
    }
    var drag = null;
    canvas.addEventListener(&quot;pointerdown&quot;, function (e) { drag = { x: e.clientX, y: e.clientY }; canvas.setPointerCapture(e.pointerId); });
    canvas.addEventListener(&quot;pointermove&quot;, function (e) {
      if (!drag) return;
      az -= (e.clientX - drag.x) * 0.008;
      el = Math.min(1.45, Math.max(-0.15, el + (e.clientY - drag.y) * 0.006));
      drag = { x: e.clientX, y: e.clientY }; applyCam();
    });
    canvas.addEventListener(&quot;pointerup&quot;, function () { drag = null; });
    canvas.addEventListener(&quot;pointercancel&quot;, function () { drag = null; });
    canvas.addEventListener(&quot;wheel&quot;, function (e) {
      e.preventDefault(); dist = Math.min(1.6, Math.max(0.25, dist * (1 + e.deltaY * 0.001))); applyCam();
    }, { passive: false });

    /* 상태 라벨(콘솔 foot) */
    var frameLbl = document.getElementById(&quot;framelbl&quot;), ledLab = document.getElementById(&quot;ledlab&quot;), playbtn = document.getElementById(&quot;playbtn&quot;);
    var ledOn = false;
    function renderFrame(i) {
      applyFK(A.joints, FR[i]);
      var on = i >= LEDF;
      if (on !== ledOn) { ledOn = on; setLED(A, on); A.btn.position.y = on ? 0.007 : 0.01; if (ledLab) { ledLab.textContent = on ? &quot;LED ●&quot; : &quot;LED ○&quot;; ledLab.style.color = on ? &quot;var(--grn)&quot; : &quot;&quot;; } }
      if (frameLbl) frameLbl.textContent = (i + 1) + &quot;/&quot; + N;
    }

    function resize() {
      var w = canvas.clientWidth || 460, h = canvas.clientHeight || 312;
      renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); applyCam();
    }
    if (global.ResizeObserver) new ResizeObserver(resize).observe(canvas);

    /* prefers-reduced-motion: 누른 자세 + LED 켜짐 정적 표시, 루프 없음 */
    if (RM) {
      renderFrame(LEDF); applyCam();
      if (playbtn) { playbtn.textContent = &quot;▶ 재생&quot;; }
      return;
    }

    /* 자동재생: fps로 루프. 재생/정지 토글 */
    var playing = true, last = 0, acc = 0, frame = 0;
    renderFrame(0); applyCam();
    if (playbtn) playbtn.addEventListener(&quot;click&quot;, function () {
      playing = !playing; playbtn.textContent = playing ? &quot;❚❚ 일시정지&quot; : &quot;▶ 재생&quot;;
    });
    function loop(t) {
      requestAnimationFrame(loop);
      var dt = Math.min(0.1, (t - last) / 1000 || 0); last = t;
      if (playing) {
        acc += dt * FPS;
        while (acc >= 1) { acc -= 1; frame = (frame + 1) % N; }
        renderFrame(frame);
      }
      renderer.render(scene, camera);
    }
    requestAnimationFrame(loop);
  }

  /* ── 진입점 ── */
  if (typeof module !== &quot;undefined&quot; &amp;&amp; module.exports) {
    module.exports = { buildArm: buildArm, applyFK: applyFK, setLED: setLED, CAL: CAL };
  } else if (typeof document !== &quot;undefined&quot;) {
    if (document.readyState === &quot;loading&quot;) document.addEventListener(&quot;DOMContentLoaded&quot;, initHero3D);
    else initHero3D();
  }
})(typeof window !== &quot;undefined&quot; ? window : globalThis);

</script>
</body>
</html>
"></iframe>
