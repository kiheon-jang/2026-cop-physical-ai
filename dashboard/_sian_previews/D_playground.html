<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CoP · Physical AI — 만지고 싶은 로봇 홈</title>
<meta name="description" content="로봇팔에게 엘리베이터 제어반 정비를 가르칩니다. 가상에서 배우고 실물로 옮깁니다. 지금 진행 중 — 2단계 리셋버튼 92.5%.">
<style>
  /* ============ 테마 토큰 ============ */
  /* B톤 통일(미션컨트롤 쿨다크) — 파스텔/퍼플 팔레트를 B 쿨다크로 고정 */
  :root, :root[data-theme="light"], :root[data-theme="dark"]{
    --canvas:#05070e; --canvas2:#080b15; --surface:#0b101c; --surface2:#0e1524;
    --ink:#e8eefb; --muted:#8ea0bd; --line:rgba(150,175,220,.16);
    --green:#2ee6a0; --green-ink:#5fd79a; --green-soft:rgba(46,230,160,.13);
    --amber:#f8b64c; --amber-ink:#f8cf8a; --amber-soft:rgba(248,182,76,.13);
    --red:#ff6b6b; --red-ink:#ff9b9b; --red-soft:rgba(255,107,107,.13);
    --blue:#39c6f0; --blue-soft:rgba(57,198,240,.13);
    --purple:#6ea8f0; --purple-soft:rgba(110,168,240,.13);
    --pink:#39c6f0; --pink-soft:rgba(57,198,240,.13);
    --pcb-a:#1c9c6d; --pcb-b:#0b7c46; --pad:#f8b64c; --metal:#3a4150;
    --pop:0 8px 0 -3px rgba(0,0,0,.4), 0 22px 40px -22px rgba(0,0,0,.72);
    --pop-sm:0 5px 0 -2px rgba(0,0,0,.36), 0 12px 22px -14px rgba(0,0,0,.6);
    --ring: rgba(57,198,240,.55);
    --font:"Apple SD Gothic Neo","Pretendard",system-ui,-apple-system,"Segoe UI",Roboto,"Malgun Gothic",sans-serif;
    color-scheme:dark;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --canvas:#05070e; --canvas2:#080b15; --surface:#0b101c; --surface2:#0e1524;
      --ink:#e8eefb; --muted:#8ea0bd; --line:rgba(150,175,220,.16);
      --green:#2ee6a0; --green-ink:#5fd79a; --green-soft:rgba(46,230,160,.13);
      --amber:#f8b64c; --amber-ink:#f8cf8a; --amber-soft:rgba(248,182,76,.13);
      --red:#ff6b6b; --red-ink:#ff9b9b; --red-soft:rgba(255,107,107,.13);
      --blue:#39c6f0; --blue-soft:rgba(57,198,240,.13);
      --purple:#6ea8f0; --purple-soft:rgba(110,168,240,.13);
      --pink:#39c6f0; --pink-soft:rgba(57,198,240,.13);
      --pop:0 8px 0 -3px rgba(0,0,0,.4), 0 22px 40px -22px rgba(0,0,0,.72);
      --pop-sm:0 5px 0 -2px rgba(0,0,0,.36), 0 12px 22px -14px rgba(0,0,0,.6);
      --ring: rgba(57,198,240,.55);
      color-scheme:dark;
    }
  }

  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  @media (prefers-reduced-motion:reduce){ html{scroll-behavior:auto} }
  body{
    margin:0; font-family:var(--font); color:var(--ink);
    background:
      radial-gradient(1100px 620px at 88% -8%, var(--purple-soft), transparent 60%),
      radial-gradient(900px 560px at -6% 6%, var(--blue-soft), transparent 62%),
      radial-gradient(760px 640px at 60% 108%, var(--pink-soft), transparent 66%),
      var(--canvas);
    -webkit-font-smoothing:antialiased; overflow-x:hidden;
    line-height:1.55;
  }
  a{color:inherit; text-decoration:none}
  h1,h2,h3{margin:0; line-height:1.08; letter-spacing:-.02em; font-weight:900}

  .wrap{max-width:1160px; margin:0 auto; padding:0 22px}

  /* ============ 커서 트레일 ============ */
  .trail{position:fixed; top:0; left:0; width:12px; height:12px; border-radius:50%;
    pointer-events:none; z-index:60; mix-blend-mode:multiply; opacity:0;
    transform:translate(-50%,-50%); transition:opacity .3s}
  :root[data-theme="dark"] .trail{mix-blend-mode:screen}

  /* ============ 네비 ============ */
  header.nav{position:sticky; top:0; z-index:50; backdrop-filter:blur(10px);
    background:color-mix(in srgb, var(--canvas) 78%, transparent);
    border-bottom:1px solid var(--line)}
  .nav .wrap{display:flex; align-items:center; gap:14px; height:66px}
  .brand{display:flex; align-items:center; gap:10px; font-weight:900; letter-spacing:-.02em; white-space:nowrap}
  .brand .mark{width:30px; height:30px; border-radius:9px; display:grid; place-items:center;
    background:linear-gradient(135deg,var(--green),var(--blue)); color:#fff; box-shadow:var(--pop-sm)}
  .brand .mark svg{width:18px;height:18px}
  .brand small{color:var(--muted); font-weight:700; font-size:12px}
  .menu{display:flex; gap:6px; margin-left:auto; align-items:center; overflow:auto; scrollbar-width:none}
  .menu::-webkit-scrollbar{display:none}
  .chip{padding:8px 13px; border-radius:999px; font-size:13.5px; font-weight:800; color:var(--muted);
    white-space:nowrap; border:1.5px solid transparent; transition:transform .18s cubic-bezier(.2,1.4,.35,1), color .18s, background .18s, border-color .18s}
  .chip:hover{color:var(--ink); background:var(--surface); border-color:var(--line); transform:translateY(-2px)}
  .theme-btn{flex:0 0 auto; width:38px; height:38px; border-radius:11px; border:1.5px solid var(--line);
    background:var(--surface); cursor:pointer; display:grid; place-items:center; color:var(--ink);
    transition:transform .18s cubic-bezier(.2,1.6,.4,1), box-shadow .18s}
  .theme-btn:hover{transform:translateY(-2px) rotate(-8deg); box-shadow:var(--pop-sm)}
  .theme-btn svg{width:19px; height:19px}

  /* ============ 스프링 진입 ============ */
  .spring{opacity:0; transform:translateY(26px) scale(.94)}
  .go .spring{opacity:1; transform:none;
    transition:opacity .6s ease, transform .7s cubic-bezier(.18,1.5,.32,1)}
  .go .spring.d1{transition-delay:.05s}
  .go .spring.d2{transition-delay:.13s}
  .go .spring.d3{transition-delay:.22s}
  .go .spring.d4{transition-delay:.31s}
  .go .spring.d5{transition-delay:.4s}
  .reveal{opacity:0; transform:translateY(34px) scale(.96)}
  .reveal.in{opacity:1; transform:none; transition:opacity .6s ease, transform .75s cubic-bezier(.18,1.45,.32,1)}
  @media (prefers-reduced-motion:reduce){
    .spring,.reveal{opacity:1 !important; transform:none !important; transition:none !important}
  }

  /* ============ 히어로 ============ */
  .hero{padding:40px 0 34px}
  .hero-grid{display:grid; grid-template-columns:1.02fr 1.15fr; gap:34px; align-items:center}
  .kick{display:inline-flex; align-items:center; gap:9px; padding:7px 14px; border-radius:999px;
    background:var(--amber-soft); color:var(--amber-ink); font-weight:800; font-size:13px; box-shadow:var(--pop-sm)}
  .kick .dot{width:9px; height:9px; border-radius:50%; background:var(--amber);
    box-shadow:0 0 0 0 var(--amber); animation:pulse 1.9s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--amber) 70%,transparent)}
    70%{box-shadow:0 0 0 11px transparent} 100%{box-shadow:0 0 0 0 transparent}}
  @media (prefers-reduced-motion:reduce){.kick .dot{animation:none}}
  h1.title{font-size:clamp(34px,5.1vw,60px); margin:18px 0 0}
  h1.title .hl{position:relative; white-space:nowrap}
  h1.title .hl::after{content:""; position:absolute; left:-3px; right:-3px; bottom:.06em; height:.34em;
    background:linear-gradient(90deg,var(--green-soft),var(--green-soft)); border-radius:6px; z-index:-1; transform:rotate(-1deg)}
  .lead{margin:18px 0 0; font-size:clamp(15.5px,1.6vw,18.5px); color:var(--muted); max-width:33ch; font-weight:600}
  .cta{display:flex; gap:12px; margin-top:26px; flex-wrap:wrap}
  .btn{position:relative; border:none; cursor:pointer; font-family:inherit; font-weight:900; font-size:15px;
    padding:14px 22px; border-radius:15px; transition:transform .16s cubic-bezier(.2,1.5,.4,1), box-shadow .16s}
  .btn.primary{background:linear-gradient(135deg,var(--green),#12945a); color:#fff; box-shadow:var(--pop)}
  .btn.ghost{background:var(--surface); color:var(--ink); box-shadow:var(--pop-sm); border:1.5px solid var(--line)}
  .btn:hover{transform:translateY(-3px)}
  .btn:active{transform:translateY(1px)}
  .btn .mag{display:inline-block; will-change:transform}

  .hero-stats{display:flex; gap:22px; margin-top:30px; flex-wrap:wrap}
  .hs{display:flex; flex-direction:column}
  .hs b{font-size:24px; font-weight:900; letter-spacing:-.03em}
  .hs span{font-size:12.5px; color:var(--muted); font-weight:700}
  .hs .g{color:var(--green-ink)} .hs .a{color:var(--amber-ink)} .hs .b{color:var(--blue)}

  /* ============ 플레이 카드 ============ */
  .play{position:relative; background:var(--surface); border-radius:28px; box-shadow:var(--pop);
    border:1.5px solid var(--line); padding:14px; overflow:hidden}
  .play::before{content:""; position:absolute; inset:0; border-radius:28px; pointer-events:none;
    background:radial-gradient(420px 260px at 70% 8%, color-mix(in srgb,var(--green) 12%,transparent), transparent 70%)}
  .play-head{display:flex; align-items:center; justify-content:space-between; padding:6px 8px 4px; position:relative; z-index:2}
  .play-head .tag{display:inline-flex; align-items:center; gap:7px; font-weight:800; font-size:12.5px; color:var(--muted)}
  .play-head .tag i{width:9px; height:9px; border-radius:50%; background:var(--green); display:inline-block}
  .counter{display:flex; align-items:center; gap:8px; background:var(--surface2); border:1.5px solid var(--line);
    padding:5px 11px; border-radius:999px; font-weight:900; font-size:13px}
  .counter b{font-variant-numeric:tabular-nums; color:var(--green-ink); min-width:1.4ch; text-align:right; display:inline-block}
  .counter.bump{animation:bump .42s cubic-bezier(.2,1.7,.4,1)}
  @keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.22) rotate(-3deg)}100%{transform:scale(1)}}

  .stage{position:relative; z-index:2; touch-action:none}
  .stage svg{display:block; width:100%; height:auto; cursor:none}
  .hint{position:absolute; left:50%; bottom:12px; transform:translateX(-50%); z-index:3;
    background:var(--ink); color:var(--canvas); font-weight:800; font-size:12.5px; padding:8px 14px;
    border-radius:999px; box-shadow:var(--pop-sm); white-space:nowrap; transition:opacity .5s, transform .5s;
    animation:floaty 2.4s ease-in-out infinite}
  @keyframes floaty{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-5px)}}
  .hint.hide{opacity:0; transform:translateX(-50%) translateY(8px); pointer-events:none}
  @media (prefers-reduced-motion:reduce){.hint{animation:none}}
  .spark{position:absolute; width:10px; height:10px; border-radius:3px; pointer-events:none; z-index:4}

  /* ============ 섹션 공통 ============ */
  section.band{padding:64px 0}
  .eyebrow{font-weight:900; font-size:13px; letter-spacing:.14em; text-transform:uppercase; color:var(--blue)}
  .h2{font-size:clamp(26px,3.6vw,40px); margin-top:10px}
  .sub{color:var(--muted); font-weight:600; margin-top:12px; max-width:52ch; font-size:16px}
  .sec-head{margin-bottom:34px}

  /* ============ 여정(3단계) ============ */
  .rail{display:grid; grid-template-columns:repeat(3,1fr); gap:20px; position:relative}
  .rail::before{content:""; position:absolute; top:60px; left:11%; right:11%; height:5px; border-radius:5px;
    background:repeating-linear-gradient(90deg,var(--line) 0 12px, transparent 12px 22px); z-index:0}
  .jcard{position:relative; z-index:1; background:var(--surface); border:1.5px solid var(--line);
    border-radius:22px; padding:22px; box-shadow:var(--pop-sm); cursor:pointer;
    transition:transform .2s cubic-bezier(.2,1.4,.4,1), box-shadow .2s}
  .jcard:hover{transform:translateY(-6px); box-shadow:var(--pop)}
  .jcard .num{width:44px; height:44px; border-radius:13px; display:grid; place-items:center; font-weight:900;
    font-size:19px; color:#fff; margin-bottom:14px; box-shadow:var(--pop-sm)}
  .j1 .num{background:linear-gradient(135deg,var(--green),#0f8a51)}
  .j2 .num{background:linear-gradient(135deg,var(--amber),#e08a00)}
  .j3 .num{background:linear-gradient(135deg,var(--purple),#7d5ce0)}
  .jcard h3{font-size:19px}
  .jcard .en{color:var(--muted); font-weight:700; font-size:12.5px; margin-top:3px}
  .badge{display:inline-flex; align-items:center; gap:6px; margin-top:14px; padding:5px 11px; border-radius:999px;
    font-weight:800; font-size:12.5px}
  .badge.done{background:var(--green-soft); color:var(--green-ink)}
  .badge.prog{background:var(--amber-soft); color:var(--amber-ink)}
  .badge.plan{background:var(--purple-soft); color:var(--purple)}
  .badge i{width:8px; height:8px; border-radius:50%; background:currentColor}
  .meter{height:9px; border-radius:6px; background:var(--surface2); margin-top:15px; overflow:hidden; border:1px solid var(--line)}
  .meter b{display:block; height:100%; border-radius:6px; width:0; transition:width 1.1s cubic-bezier(.2,.9,.2,1)}
  .j1 .meter b{background:var(--green)} .j2 .meter b{background:var(--amber)} .j3 .meter b{background:var(--purple)}
  .detail{max-height:0; overflow:hidden; transition:max-height .4s ease, margin .4s ease, opacity .3s; opacity:0; margin-top:0}
  .jcard.open .detail{max-height:200px; opacity:1; margin-top:14px}
  .detail p{margin:0; font-size:13.5px; color:var(--muted); font-weight:600; line-height:1.6}
  .jcard .more{margin-top:14px; font-weight:800; font-size:12.5px; color:var(--blue)}
  .jcard .more::after{content:" ▾"}
  .jcard.open .more::after{content:" ▴"}

  /* ============ 성과지표 ============ */
  .stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(168px,1fr)); gap:18px}
  .stat{background:var(--surface); border:1.5px solid var(--line); border-radius:20px; padding:22px 20px;
    box-shadow:var(--pop-sm); cursor:default; transition:transform .18s cubic-bezier(.2,1.5,.4,1), box-shadow .18s}
  .stat:hover{transform:translateY(-6px) rotate(-1deg); box-shadow:var(--pop)}
  .stat.pop{animation:bump .5s cubic-bezier(.2,1.7,.4,1)}
  .stat .v{font-size:clamp(30px,4vw,42px); font-weight:900; letter-spacing:-.03em; font-variant-numeric:tabular-nums}
  .stat .l{color:var(--muted); font-weight:700; font-size:13px; margin-top:6px}
  .stat .c1{color:var(--amber-ink)} .stat .c2{color:var(--green-ink)}
  .stat .c3{color:var(--blue)} .stat .c4{color:var(--purple)} .stat .c5{color:var(--pink)}

  /* ============ 파이프라인 ============ */
  .pipe-wrap{background:var(--surface); border:1.5px solid var(--line); border-radius:26px; padding:30px 24px 26px;
    box-shadow:var(--pop); position:relative; overflow:hidden}
  .track{position:relative; display:grid; grid-template-columns:repeat(4,1fr); gap:10px; padding:20px 6px 8px}
  .track::before{content:""; position:absolute; left:8%; right:8%; top:56px; height:4px; border-radius:4px;
    background:repeating-linear-gradient(90deg,var(--line) 0 10px, transparent 10px 20px)}
  .flow{position:absolute; top:47px; width:22px; height:22px; border-radius:50%; z-index:3;
    background:var(--green); color:#fff; display:grid; place-items:center; box-shadow:0 6px 14px -4px color-mix(in srgb,var(--green) 80%,transparent);
    left:-6%; animation:flow 5.4s linear infinite}
  .flow svg{width:12px;height:12px}
  .flow.f2{animation-delay:1.8s} .flow.f3{animation-delay:3.6s}
  @keyframes flow{0%{left:-6%; opacity:0} 6%{opacity:1} 92%{opacity:1} 100%{left:104%; opacity:0}}
  @media (prefers-reduced-motion:reduce){.flow{animation:none; left:auto; right:6%; top:47px} .flow.f2{left:38%} .flow.f3{left:70%}}
  .node{position:relative; z-index:2; text-align:center; cursor:pointer;
    transition:transform .2s cubic-bezier(.2,1.5,.4,1)}
  .node:hover{transform:translateY(-4px)}
  .node .bubble{width:64px; height:64px; margin:0 auto; border-radius:20px; display:grid; place-items:center;
    background:var(--surface2); border:2px solid var(--line); box-shadow:var(--pop-sm); transition:border-color .2s, background .2s}
  .node.active .bubble{border-color:var(--green); background:var(--green-soft)}
  .node .bubble svg{width:30px; height:30px; color:var(--ink)}
  .node .nm{font-weight:900; font-size:14.5px; margin-top:12px}
  .node .en{font-weight:700; font-size:11.5px; color:var(--muted); margin-top:2px}
  .pipe-detail{margin-top:22px; background:var(--surface2); border:1.5px dashed var(--line); border-radius:16px;
    padding:16px 18px; font-weight:600; color:var(--muted); font-size:14.5px; min-height:56px; transition:opacity .25s}
  .pipe-detail b{color:var(--ink)}
  .loopnote{display:inline-flex; align-items:center; gap:8px; margin-top:18px; font-weight:800; font-size:13px; color:var(--green-ink)}
  .loopnote svg{width:17px;height:17px; animation:spin 5s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.loopnote svg{animation:none}}

  /* ============ 더 둘러보기 ============ */
  .explore{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:18px}
  .ex{position:relative; background:var(--surface); border:1.5px solid var(--line); border-radius:20px; padding:22px;
    box-shadow:var(--pop-sm); overflow:hidden; transition:transform .2s cubic-bezier(.2,1.4,.4,1), box-shadow .2s}
  .ex:hover{transform:translateY(-6px); box-shadow:var(--pop)}
  .ex .emo{font-size:30px; display:block}
  .ex h3{font-size:17px; margin-top:14px}
  .ex p{color:var(--muted); font-weight:600; font-size:13px; margin:6px 0 0}
  .ex .arw{position:absolute; right:18px; bottom:16px; font-weight:900; color:var(--blue); transition:transform .2s}
  .ex:hover .arw{transform:translateX(5px)}
  .ex::after{content:""; position:absolute; inset:0; opacity:.5; z-index:-1;
    background:radial-gradient(220px 140px at 90% 0%, var(--accent,transparent), transparent 70%)}

  /* ============ 푸터 ============ */
  footer{padding:40px 0 60px; border-top:1px solid var(--line); margin-top:20px}
  .foot{display:flex; flex-wrap:wrap; gap:18px 30px; align-items:center; justify-content:space-between}
  .foot .f-brand{font-weight:900}
  .foot .f-meta{color:var(--muted); font-weight:700; font-size:13px}
  .foot .f-pills{display:flex; gap:8px; flex-wrap:wrap}
  .foot .f-pill{padding:6px 12px; border-radius:999px; background:var(--surface); border:1.5px solid var(--line);
    font-weight:800; font-size:12.5px; color:var(--muted)}

  /* ============ 반응형 ============ */
  @media (max-width:900px){
    .hero-grid{grid-template-columns:1fr; gap:26px}
    .lead{max-width:none}
    .rail{grid-template-columns:1fr; gap:16px}
    .rail::before{display:none}
    .brand small{display:none}
  }
  @media (max-width:560px){
    .hero{padding:26px 0}
    .cta{gap:10px}
    .btn{flex:1 1 auto; text-align:center}
    .track{grid-template-columns:repeat(2,1fr); gap:18px 10px}
    .track::before{display:none}
    .flow{display:none}
    section.band{padding:48px 0}
    .hero-stats{gap:16px}
  }
</style>
</head>
<body>

<!-- 커서 트레일 (JS가 채움) -->
<div id="trails" aria-hidden="true"></div>

<!-- ============ 네비 ============ -->


<main id="top">

<!-- ============ 히어로 ============ -->
<section class="hero">
  <div class="wrap" style="max-width:820px">
    <div class="spring d1" style="text-align:center; margin:0 0 24px">
      <span class="kick"><span class="dot"></span>직접 해보세요</span>
      <h1 class="title" style="margin-top:16px; font-size:clamp(26px,3.6vw,40px)">빨간 버튼을 가리키면 <span class="hl">로봇팔이 따라옵니다</span></h1>
      <p class="lead" style="margin:14px auto 0; max-width:34ch">마우스나 손가락을 버튼 위로 가져가 보세요. 로봇팔이 실시간으로 위치를 따라가 누릅니다.</p>
    </div>

    <!-- 인터랙티브 플레이 카드 -->
    <div class="play spring d3" id="playCard">
      <div class="play-head">
        <span class="tag"><i></i>LIVE 플레이그라운드</span>
        <span class="counter" id="counter">버튼 누른 횟수 <b id="cnt">0</b></span>
      </div>
      <div class="stage" id="stage">
        <svg id="scene" viewBox="0 0 460 360" role="img" aria-label="로봇팔이 초록 기판의 빨간 리셋버튼을 누르면 초록 LED가 켜지는 인터랙티브 장면. 마우스나 손가락으로 빨간 버튼 위를 가리키면 로봇팔이 따라와 누릅니다.">
          <defs>
            <linearGradient id="pcbG" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="var(--pcb-a)"/><stop offset="1" stop-color="var(--pcb-b)"/>
            </linearGradient>
            <linearGradient id="armG" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="var(--metal)"/><stop offset="1" stop-color="#8b90a3"/>
            </linearGradient>
            <radialGradient id="ledG" cx="50%" cy="40%" r="60%">
              <stop offset="0" stop-color="#eafff2"/><stop offset="1" stop-color="var(--green)"/>
            </radialGradient>
            <radialGradient id="btnG" cx="42%" cy="35%" r="72%">
              <stop offset="0" stop-color="#ff9a9a"/><stop offset="1" stop-color="var(--red)"/>
            </radialGradient>
            <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
              <feGaussianBlur stdDeviation="5"/>
            </filter>
          </defs>

          <!-- PCB 기판 -->
          <g id="board">
            <rect x="58" y="214" width="344" height="126" rx="16" fill="url(#pcbG)"/>
            <rect x="58" y="214" width="344" height="126" rx="16" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="1.5"/>
            <!-- 실크스크린 트레이스 -->
            <g stroke="rgba(255,255,255,.28)" stroke-width="2" fill="none" stroke-linecap="round">
              <path d="M78 250 h60 v26 h44"/><path d="M92 320 h120"/>
              <path d="M250 232 v40 h60"/><path d="M348 250 v70"/>
            </g>
            <!-- 골드 패드 -->
            <g fill="var(--pad)">
              <rect x="72" y="242" width="9" height="9" rx="2"/><rect x="72" y="256" width="9" height="9" rx="2"/>
              <rect x="72" y="270" width="9" height="9" rx="2"/><rect x="384" y="300" width="9" height="9" rx="2"/>
              <circle cx="150" cy="325" r="4"/><circle cx="170" cy="325" r="4"/><circle cx="190" cy="325" r="4"/>
            </g>
            <!-- IC 칩 -->
            <g>
              <rect x="96" y="286" width="62" height="34" rx="4" fill="#1c1e26"/>
              <g fill="#3a3d49"><rect x="100" y="282" width="5" height="5"/><rect x="112" y="282" width="5" height="5"/><rect x="124" y="282" width="5" height="5"/><rect x="136" y="282" width="5" height="5"/><rect x="148" y="282" width="5" height="5"/></g>
              <circle cx="104" cy="292" r="2.4" fill="#6b6f7d"/>
            </g>
            <text x="286" y="238" fill="rgba(255,255,255,.72)" font-family="var(--font)" font-size="10" font-weight="800" letter-spacing="1.5">RESET</text>
            <text x="338" y="336" fill="rgba(255,255,255,.62)" font-family="var(--font)" font-size="9" font-weight="800" letter-spacing="1">STATUS</text>
          </g>

          <!-- 초록 LED -->
          <g id="ledGroup">
            <circle id="ledGlow" cx="352" cy="300" r="24" fill="var(--green)" filter="url(#soft)" opacity="0"/>
            <circle cx="352" cy="300" r="11" fill="#0c3a24" stroke="rgba(255,255,255,.25)" stroke-width="1.5"/>
            <circle id="led" cx="352" cy="300" r="8.5" fill="#0f4a2d"/>
            <g id="ledRays" opacity="0" stroke="var(--green)" stroke-width="2.4" stroke-linecap="round">
              <path d="M352 280 v-8"/><path d="M352 320 v8"/><path d="M332 300 h-8"/><path d="M372 300 h8"/>
            </g>
          </g>

          <!-- 리셋 버튼 (드래그 가능) -->
          <g id="btnGroup" style="cursor:grab">
            <circle id="btnShadow" cx="288" cy="266" r="21" fill="rgba(0,0,0,.28)"/>
            <circle id="btnBase" cx="288" cy="262" r="21" fill="#7a1717"/>
            <circle id="btnTop" cx="288" cy="258" r="18" fill="url(#btnG)" stroke="#c23a3a" stroke-width="1.5"/>
            <ellipse id="btnGloss" cx="282" cy="252" rx="7" ry="4.5" fill="rgba(255,255,255,.55)"/>
          </g>

          <!-- 로봇팔 (JS가 관절 좌표 갱신) -->
          <g id="arm">
            <!-- 갠트리/베이스 -->
            <rect x="70" y="34" width="86" height="16" rx="7" fill="url(#armG)"/>
            <rect x="104" y="46" width="16" height="16" rx="4" fill="#6a6f80"/>
            <circle id="j0" cx="112" cy="70" r="11" fill="#4a4f60"/>
            <!-- 상완 -->
            <line id="bone1" x1="112" y1="70" x2="253" y2="120" stroke="url(#armG)" stroke-width="15" stroke-linecap="round"/>
            <!-- 팔꿈치 -->
            <circle id="j1" cx="253" cy="120" r="9" fill="#5a6072"/>
            <!-- 하완 -->
            <line id="bone2" x1="253" y1="120" x2="288" y2="258" stroke="url(#armG)" stroke-width="12" stroke-linecap="round"/>
            <!-- 그리퍼 -->
            <g id="grip" transform="translate(288,258) rotate(-14)">
              <rect x="-8" y="-4" width="16" height="12" rx="3" fill="#5a6072"/>
              <rect id="grL" x="-9" y="6" width="5" height="13" rx="2.4" fill="#7b8195"/>
              <rect id="grR" x="4" y="6" width="5" height="13" rx="2.4" fill="#7b8195"/>
            </g>
          </g>
        </svg>
        <div class="hint" id="hint">👆 빨간 버튼을 가리켜 보세요 — 로봇팔이 따라와 누릅니다</div>
        <div id="sparks" style="position:absolute;inset:0;pointer-events:none;z-index:4"></div>
      </div>
    </div>
  </div>
</section>

</main>

<!-- ============ 푸터 ============ -->


<script>
(function(){
  "use strict";
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var coarse = window.matchMedia("(pointer: coarse)").matches;

  /* ---------- 스프링 진입 ---------- */
  requestAnimationFrame(function(){ document.body.classList.add("go"); });

  /* ---------- 테마 토글 ---------- */
  var root = document.documentElement, tb = document.getElementById("themeBtn");
  try{ var saved = localStorage.getItem("cop-theme"); if(saved) root.setAttribute("data-theme", saved); }catch(e){}
  tb.addEventListener("click", function(){
    var cur = root.getAttribute("data-theme");
    var next = cur === "dark" ? "light" : (cur === "light" ? "dark" :
      (window.matchMedia("(prefers-color-scheme: dark)").matches ? "light" : "dark"));
    root.setAttribute("data-theme", next);
    try{ localStorage.setItem("cop-theme", next); }catch(e){}
  });

  /* ---------- 스크롤 리빌 + 카운트업 + 미터 ---------- */
  function countUp(el){
    var to = parseFloat(el.getAttribute("data-to"));
    var pre = el.getAttribute("data-prefix")||"", suf = el.getAttribute("data-suffix")||"";
    var dec = (to % 1 !== 0) ? 1 : 0;
    if(reduce){ el.textContent = pre + to.toFixed(dec) + suf; return; }
    var start = performance.now(), dur = 1050;
    function tick(now){
      var p = Math.min(1, (now-start)/dur);
      var e = 1 - Math.pow(1-p, 3);
      el.textContent = pre + (to*e).toFixed(dec) + suf;
      if(p<1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }
  var io = new IntersectionObserver(function(ents){
    ents.forEach(function(en){
      if(!en.isIntersecting) return;
      var el = en.target;
      el.classList.add("in");
      if(el.classList.contains("jcard")){
        var m = el.querySelector(".meter b");
        if(m) m.style.width = el.getAttribute("data-fill") + "%";
      }
      var num = el.querySelector ? el.querySelector(".v[data-to]") : null;
      if(num) countUp(num);
      io.unobserve(el);
    });
  }, {threshold:.28});
  document.querySelectorAll(".reveal").forEach(function(el){ io.observe(el); });

  /* ---------- 여정 카드 펼침 ---------- */
  document.querySelectorAll(".jcard").forEach(function(c){
    c.addEventListener("click", function(){ c.classList.toggle("open"); });
  });

  /* ---------- 성과 카드 클릭 통통 ---------- */
  document.querySelectorAll(".stat").forEach(function(s){
    s.addEventListener("click", function(){
      s.classList.remove("pop"); void s.offsetWidth; s.classList.add("pop");
    });
  });

  /* ---------- 파이프라인 노드 ---------- */
  var pd = document.getElementById("pipeDetail");
  document.querySelectorAll(".node").forEach(function(n){
    n.addEventListener("click", function(){
      document.querySelectorAll(".node").forEach(function(x){ x.classList.remove("active"); });
      n.classList.add("active");
      pd.style.opacity = 0;
      setTimeout(function(){ pd.innerHTML = n.getAttribute("data-txt"); pd.style.opacity = 1; }, 140);
    });
  });

  /* ---------- 자석 버튼/칩 ---------- */
  function magnet(el, inner, strength){
    if(coarse) return;
    el.addEventListener("pointermove", function(e){
      var r = el.getBoundingClientRect();
      var x = (e.clientX - r.left - r.width/2) * strength;
      var y = (e.clientY - r.top - r.height/2) * strength;
      inner.style.transform = "translate(" + x + "px," + y + "px)";
    });
    el.addEventListener("pointerleave", function(){ inner.style.transform = ""; });
  }
  document.querySelectorAll(".mag-btn").forEach(function(b){ magnet(b, b.querySelector(".mag"), .3); });
  document.querySelectorAll(".mag-chip").forEach(function(c){ magnet(c, c, .18); });

  /* ---------- 커서 트레일 ---------- */
  if(!coarse && !reduce){
    var cols = ["var(--green)","var(--blue)","var(--purple)","var(--pink)","var(--amber)"];
    var N = 6, dots = [], container = document.getElementById("trails");
    for(var i=0;i<N;i++){
      var d = document.createElement("div"); d.className="trail";
      d.style.background = cols[i%cols.length]; d.style.transform="scale("+(1-i*0.12)+")";
      container.appendChild(d); dots.push({el:d,x:0,y:0});
    }
    var mx=innerWidth/2, my=innerHeight/2, active=false;
    addEventListener("pointermove", function(e){
      if(e.pointerType==="touch") return;
      mx=e.clientX; my=e.clientY;
      if(!active){ active=true; dots.forEach(function(o){o.el.style.opacity=.7;}); }
    });
    (function loop(){
      var px=mx, py=my;
      dots.forEach(function(o){
        o.x += (px-o.x)*0.35; o.y += (py-o.y)*0.35;
        o.el.style.left=o.x+"px"; o.el.style.top=o.y+"px";
        px=o.x; py=o.y;
      });
      requestAnimationFrame(loop);
    })();
  }

  /* ================= 히어로 로봇팔 IK 플레이그라운드 ================= */
  var svg = document.getElementById("scene");
  var bone1=document.getElementById("bone1"), bone2=document.getElementById("bone2");
  var j1=document.getElementById("j1"), grip=document.getElementById("grip");
  var grL=document.getElementById("grL"), grR=document.getElementById("grR");
  var led=document.getElementById("led"), ledGlow=document.getElementById("ledGlow"), ledRays=document.getElementById("ledRays");
  var btnGroup=document.getElementById("btnGroup"), btnTop=document.getElementById("btnTop"),
      btnBase=document.getElementById("btnBase"), btnGloss=document.getElementById("btnGloss"), btnShadow=document.getElementById("btnShadow");
  var hint=document.getElementById("hint"), cntEl=document.getElementById("cnt"), counter=document.getElementById("counter");
  var sparks=document.getElementById("sparks");

  var BASE={x:112,y:70}, L1=150, L2=142;   // 팔 길이(최대 292 > 버튼거리 257, 여유 34)
  var HOME={x:288, y:258};            // 버튼 기본 위치 (버튼 top 중심)
  var PARK={x:200, y:150};            // 쉬는 자세 타겟(중앙 기판 위)
  var btn={x:HOME.x, y:HOME.y};       // 현재 버튼 위치
  var target={x:PARK.x, y:PARK.y};    // 팔이 노리는 목표(원함)
  var cur={x:PARK.x, y:PARK.y};       // 부드럽게 따라가는 실제 목표
  var dragging=false, userTook=false, pointerIn=false;
  var pressed=false, wasPressed=false, pressT=0;
  var count=0;

  function toSvg(cx, cy){
    var p = svg.createSVGPoint(); p.x=cx; p.y=cy;
    var m = svg.getScreenCTM(); if(!m) return null;
    var r = p.matrixTransform(m.inverse());
    return {x:r.x, y:r.y};
  }
  function clamp(v,a,b){ return v<a?a:(v>b?b:v); }

  // 포인터 → 버튼 히트 판정
  function hitBtn(pt){ return Math.hypot(pt.x-btn.x, pt.y-btn.y) < 24; }

  svg.addEventListener("pointerdown", function(e){
    var pt = toSvg(e.clientX, e.clientY); if(!pt) return;
    takeOver();
    if(hitBtn(pt)){
      dragging=true; btnGroup.style.cursor="grabbing";
      try{ svg.setPointerCapture(e.pointerId); }catch(_){}
    }
  });
  svg.addEventListener("pointermove", function(e){
    var pt = toSvg(e.clientX, e.clientY); if(!pt) return;
    pointerIn=true; takeOver();
    pt.x = clamp(pt.x, 64, 404); pt.y = clamp(pt.y, 58, 330);
    if(dragging){
      btn.x = clamp(pt.x, 96, 372); btn.y = clamp(pt.y, 236, 322);
      target.x = btn.x; target.y = btn.y - 2;
    } else {
      target.x = pt.x; target.y = pt.y;
    }
  });
  function endDrag(){
    if(dragging){ dragging=false; btnGroup.style.cursor="grab"; }
  }
  svg.addEventListener("pointerup", endDrag);
  svg.addEventListener("pointercancel", endDrag);
  svg.addEventListener("pointerleave", function(){
    pointerIn=false; endDrag();
    if(userTook){ target.x=PARK.x; target.y=PARK.y; }
  });

  function takeOver(){
    if(userTook) return;
    userTook=true; hint.classList.add("hide");
  }

  function confetti(sx, sy){
    if(reduce) return;
    var cols=["var(--green)","var(--amber)","var(--blue)","var(--pink)","var(--purple)"];
    for(var i=0;i<10;i++){
      var s=document.createElement("div"); s.className="spark";
      s.style.left=(sx*100)+"%"; s.style.top=(sy*100)+"%";
      s.style.background=cols[i%cols.length];
      var ang=Math.random()*Math.PI*2, dist=26+Math.random()*34;
      var dx=Math.cos(ang)*dist, dy=Math.sin(ang)*dist-14;
      s.style.transform="translate(-50%,-50%)";
      sparks.appendChild(s);
      (function(node,dx,dy){
        var st=performance.now(), dur=560+Math.random()*220;
        (function anim(now){
          var p=Math.min(1,(now-st)/dur), e=1-Math.pow(1-p,2);
          node.style.opacity=1-p;
          node.style.transform="translate(-50%,-50%) translate("+(dx*e)+"px,"+(dy*e+p*p*30)+"px) rotate("+(p*260)+"deg)";
          if(p<1) requestAnimationFrame(anim); else node.remove();
        })(st);
      })(s,dx,dy);
    }
  }

  function setLED(on){
    if(on){
      led.setAttribute("fill","url(#ledG)");
      ledGlow.setAttribute("opacity","0.85");
      ledRays.setAttribute("opacity","0.9");
    } else {
      led.setAttribute("fill","#0f4a2d");
      ledGlow.setAttribute("opacity","0");
      ledRays.setAttribute("opacity","0");
    }
  }

  // 아이들 데모 타임라인 (사용자 개입 전)
  function ease(t){ return t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2; }
  function idleTarget(now){
    var cyc=4600, t=(now % cyc)/cyc;
    var above={x:HOME.x, y:HOME.y-30};
    if(t<0.26){ var k=ease(t/0.26); return {x:PARK.x+(above.x-PARK.x)*k, y:PARK.y+(above.y-PARK.y)*k}; }
    if(t<0.40){ var k=ease((t-0.26)/0.14); return {x:above.x+(HOME.x-above.x)*k, y:above.y+(HOME.y-above.y)*k}; }
    if(t<0.56){ return {x:HOME.x, y:HOME.y}; }               // 눌러 유지
    if(t<0.74){ var k=ease((t-0.56)/0.18); return {x:HOME.x+(above.x-HOME.x)*k, y:HOME.y+(above.y-HOME.y)*k}; }
    var k=ease((t-0.74)/0.26); return {x:above.x+(PARK.x-above.x)*k, y:above.y+(PARK.y-above.y)*k};
  }

  function render(now){
    // 목표 결정
    if(!userTook){ var it=idleTarget(now); target.x=it.x; target.y=it.y; }  // 항상 데모 애니(reduced-motion 이어도 팔이 멈춰보이지 않게)

    // 부드러운 추종 (스프링 느낌)
    var k = 0.20;  // 항상 부드럽게 추종
    cur.x += (target.x-cur.x)*k;
    cur.y += (target.y-cur.y)*k;

    // 2본 IK (팔꿈치 아래로 접힘)
    var dx=cur.x-BASE.x, dy=cur.y-BASE.y;
    var d=Math.hypot(dx,dy);
    d=clamp(d, Math.abs(L1-L2)+0.5, L1+L2-0.5);
    var ang=Math.atan2(dy,dx);
    var tx=BASE.x+Math.cos(ang)*d, ty=BASE.y+Math.sin(ang)*d;
    var cosA=clamp((L1*L1+d*d-L2*L2)/(2*L1*d), -1, 1);
    var A=Math.acos(cosA);
    var a1=ang - A;   // elbow-up: 위로 접어 버튼을 위에서 내리누르는 자세
    var ex=BASE.x+Math.cos(a1)*L1, ey=BASE.y+Math.sin(a1)*L1;
    var a2=Math.atan2(ty-ey, tx-ex);

    bone1.setAttribute("x1",BASE.x); bone1.setAttribute("y1",BASE.y);
    bone1.setAttribute("x2",ex);     bone1.setAttribute("y2",ey);
    bone2.setAttribute("x1",ex);     bone2.setAttribute("y1",ey);
    bone2.setAttribute("x2",tx);     bone2.setAttribute("y2",ty);
    j1.setAttribute("cx",ex);        j1.setAttribute("cy",ey);
    grip.setAttribute("transform","translate("+tx+","+ty+") rotate("+(a2*180/Math.PI-90)+")");

    // 버튼 위치 반영
    btnShadow.setAttribute("cx",btn.x); btnBase.setAttribute("cx",btn.x); btnTop.setAttribute("cx",btn.x); btnGloss.setAttribute("cx",btn.x-6);
    btnShadow.setAttribute("cy",btn.y+8); btnBase.setAttribute("cy",btn.y+4);

    // 버튼 원위치 스프링 복귀 (드래그 안 할 때)
    if(!dragging){
      btn.x += (HOME.x-btn.x)*(reduce?1:0.14);
      btn.y += (HOME.y-btn.y)*(reduce?1:0.14);
    }

    // 눌림 판정: 팁이 버튼 중심 근처
    pressed = Math.hypot(tx-btn.x, ty-btn.y) < 15;
    pressT += ((pressed?1:0) - pressT) * 0.3;

    // 버튼 눌림 시각화 + 그리퍼 오므림
    var depress = pressT*4;
    btnTop.setAttribute("cy", btn.y - 4 + depress);
    btnGloss.setAttribute("cy", btn.y - 10 + depress);
    grL.setAttribute("x", -9 + pressT*3.2); grR.setAttribute("x", 4 - pressT*3.2);

    setLED(pressT>0.55);

    // 눌림 상승엣지 → 카운트 + 컨페티
    if(pressed && !wasPressed){
      count++; cntEl.textContent=count;
      counter.classList.remove("bump"); void counter.offsetWidth; counter.classList.add("bump");
      var sx=btn.x/460, sy=btn.y/360;
      confetti(sx, sy);
    }
    wasPressed=pressed;

    requestAnimationFrame(render);
  }
  requestAnimationFrame(render);

  // "직접 눌러보기" 버튼 → 힌트 강조/스크롤 상단
  document.getElementById("tryBtn").addEventListener("click", function(e){
    e.preventDefault();
    document.getElementById("playCard").scrollIntoView({behavior: reduce?"auto":"smooth", block:"center"});
  });
})();
</script>
